name: One-off revenue calendar UI polish
on:
  push:
    branches:
      - fix/revenue-soldout-events-ui-20260930
    paths:
      - .github/workflows/oneoff-revenue-calendar-ui-polish.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-soldout-events-ui-20260930
      - name: Polish guest labels and event cells
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/revenue/RateStrategyGrid.tsx')
          s = p.read_text()

          replacements = [
            (
              'ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UsersRound } from "lucide-react";',
              'ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UserRound, UsersRound } from "lucide-react";'
            ),
            ('{/* Events — top four demand drivers per date, ranked by impact. */}', '{/* Events — top five demand drivers per date, ranked by impact. */}'),
            ('style={{ height: showEventBand ? Math.max(ROW_H, Math.round(62 * zoom)) : ROW_H }}', 'style={{ height: (railed || showEventBand) ? Math.max(ROW_H, Math.round(74 * zoom)) : ROW_H }}'),
            ('{showEventBand ? "top 4" : "off"}', '{showEventBand ? "top 5" : "off"}'),
            ('const visible = all.slice(0, 4);', 'const visible = all.slice(0, 5);'),
            ('if (!showEventBand) {', 'if (!showEventBand && !railed) {'),
            ('{all.length > 4 && (', '{all.length > 5 && ('),
            ('+{all.length - 4} more', '+{all.length - 5} more'),
            ('leading-[12px] ${tone}', 'leading-[11px] ${tone}'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'missing expected snippet: {old}')
            s = s.replace(old, new, 1)

          old = '''{railed ? (\n                      <span className="w-full truncate text-center" style={{ fontSize: fz(10) }} title={row.label}>\n                        {row.kind === "rate" ? `${row.occ}g` : railLabel(row.label)}\n                      </span>\n                    ) : row.kind === "group" ? ('''
          new = '''{railed ? (\n                      row.kind === "rate" ? (\n                        <span\n                          className="inline-flex w-full items-center justify-center gap-0.5 tabular-nums text-foreground"\n                          style={{ fontSize: fz(10) }}\n                          title={`${row.occ} ${row.occ === 1 ? "guest" : "guests"}`}\n                          aria-label={`${row.occ} ${row.occ === 1 ? "guest" : "guests"}`}\n                        >\n                          <UserRound className="h-3 w-3 shrink-0 opacity-70" aria-hidden="true" />\n                          <span>{row.occ}</span>\n                        </span>\n                      ) : (\n                        <span className="w-full truncate text-center" style={{ fontSize: fz(10) }} title={row.label}>\n                          {railLabel(row.label)}\n                        </span>\n                      )\n                    ) : row.kind === "group" ? ('''
          if old not in s:
            raise SystemExit('missing railed rate label block')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit UI polish and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-revenue-calendar-ui-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-revenue-calendar-ui-polish.yml
          git commit -m "ui: restore sold-out and top-five event glance view"
          git push origin HEAD:fix/revenue-soldout-events-ui-20260930
