name: Maintenance room eligibility SQL CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260921131300_guard_maintenance_ticket_room_eligibility.sql'
      - 'supabase/tests/maintenance_room_eligibility_*.sql'
      - '.github/workflows/maintenance-room-eligibility-sql-ci.yml'

permissions:
  contents: read

jobs:
  maintenance-room-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_maintenance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_maintenance_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Validate guard migration and ownership scenarios in a disposable database
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/maintenance_room_eligibility_fixture.sql \
            -f supabase/migrations/20260921131300_guard_maintenance_ticket_room_eligibility.sql \
            -f supabase/tests/maintenance_room_eligibility_test.sql
