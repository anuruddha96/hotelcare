name: Migration history audit tests
on:
  pull_request:
    paths:
      - 'scripts/audit_migration_history.py'
      - 'scripts/tests/test_audit_migration_history.py'
      - '.github/workflows/migration-history-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -p test_audit_migration_history.py
