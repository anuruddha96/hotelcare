name: One-off sold-out closing sale UI fix

on:
  push:
    branches:
      - fix/soldout-last-booking-price-occupancy-20260929

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch sold-out price and occupancy UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/revenue/RateStrategyGrid.tsx')
          text = path.read_text()
          pairs = [
              ('and holding the highest guest count on record,', 'and holding the actual guest count from the reservation that sold the final unit,'),
              ('if (!cur || row.occupancy > cur.occupancy) {', 'if (!cur || row.captured_at > cur.capturedAt) {'),
              ('const topOcc = frozen?.occupancy ?? null;', 'const soldOcc = frozen?.occupancy ?? null;'),
              (' — closed at ${eur(closedAt)} for ${topOcc} ${topOcc === 1 ? "guest" : "guests"}', ' — last sold at ${eur(closedAt)} for ${soldOcc} ${soldOcc === 1 ? "guest" : "guests"}'),
              ('>{priceLabel(closedAt)}</span>', '>{priceLabel(closedAt)}{soldOcc != null ? ` · ${soldOcc}g` : ""}</span>'),
          ]
          for old, new in pairs:
              if old not in text:
                  raise SystemExit(f'Expected UI fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/oneoff-soldout-last-booking-ui.yml').unlink()
          PY
      - name: Commit UI fix and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-soldout-last-booking-ui.yml
          git commit -m "fix: show actual sold-out price and occupancy"
          git push
