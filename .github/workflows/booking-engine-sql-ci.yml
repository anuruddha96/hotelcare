name: Booking engine SQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*booking_engine*.sql'
      - 'supabase/tests/booking_engine_*'
      - '.github/workflows/booking-engine-sql-ci.yml'

permissions:
  contents: read

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: booking_engine_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Offers, restrictions, booking, cancellation and access rules
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/booking_engine_fixture.sql \
            -f supabase/migrations/20261117140000_booking_engine.sql \
            -f supabase/tests/booking_engine_integration.sql
