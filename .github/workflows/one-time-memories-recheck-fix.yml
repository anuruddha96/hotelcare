name: One-time Memories recheck repair

on:
  push:
    branches:
      - fix/memories-recheck-room-status-20260917

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply anchored, Hotel Memories-only repair
        run: python3 scripts/one_off_fix_memories_recheck.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run regression and full test suite
        run: bun run test
      - name: Verify production build
        run: bun run build
      - name: Commit verified changes and remove one-time automation
        run: |
          git rm scripts/one_off_fix_memories_recheck.py .github/workflows/one-time-memories-recheck-fix.yml
          git add src/components/dashboard/HotelRoomOverviewLive.tsx src/components/dashboard/HousekeepingManagerView.tsx src/components/dashboard/HotelMemoriesManagerStatusDialog.tsx
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(memories): show current recheck status in room chips and team view'
          git push origin HEAD:fix/memories-recheck-room-status-20260917
