name: One-time HotelCare bed setup patch
on:
  push:
    branches:
      - fix/bed-setup-bt-all-venues-20260918
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'RUN_BED_FIX_20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply strictly-scoped source changes
        run: node scripts/hc-bed-hotfix-20260918.cjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Build production app
        run: bun run build
      - name: Push source changes to this feature branch only
        run: |
          git config user.name "HotelCare GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/AssignedRoomCard.tsx src/components/dashboard/RoomCommunicationPanel.tsx src/components/dashboard/HotelRoomOverviewLive.tsx src/components/dashboard/HotelMemoriesManagerRoomOverview.tsx src/lib/housekeepingBedSetup.ts src/lib/housekeepingBedSetup.test.ts
          git commit -m "fix: standardize BT SB bed setup in live room chips and manager controls"
          git push origin HEAD:refs/heads/fix/bed-setup-bt-all-venues-20260918
