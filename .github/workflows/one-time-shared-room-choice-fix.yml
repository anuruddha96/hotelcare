name: One-time shared room choice fix

on:
  push:
    branches:
      - feature/shared-housekeeping-rooms
    paths:
      - .github/workflows/one-time-shared-room-choice-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-housekeeping-rooms
          fetch-depth: 0

      - name: Make replace/share choice available for every occupied drop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/hkAssignmentDnd.ts')
          s = p.read_text()

          replacements = [
            (
              "    description.textContent = params.inProgress\n      ? `${params.currentName} has already started this room. ${params.incomingName} can join as the second cleaner, but the active assignment cannot be replaced.`\n      : `${params.currentName} is currently assigned. What should happen when ${params.incomingName} is dropped onto this room?`;",
              "    description.textContent = params.inProgress\n      ? `${params.currentName} has already started this room. What should happen when ${params.incomingName} is dropped onto it?`\n      : `${params.currentName} is currently assigned. What should happen when ${params.incomingName} is dropped onto this room?`;",
            ),
            (
              "    help.textContent = params.inProgress\n      ? 'Work together keeps one shared room status, minibar record and dirty-linen record.'\n      : `Replace moves the room from ${params.currentName} to ${params.incomingName}. Work together keeps ${params.currentName} and adds ${params.incomingName} as the second cleaner.`;",
              "    help.textContent = params.inProgress\n      ? `Replace transfers the active room to ${params.incomingName} while keeping the existing cleaning timeline. Work together keeps ${params.currentName} and adds ${params.incomingName} to the same room, minibar and dirty-linen record.`\n      : `Replace moves the room from ${params.currentName} to ${params.incomingName}. Work together keeps ${params.currentName} and adds ${params.incomingName} as the second cleaner.`;",
            ),
            (
              "    Object.assign(actions.style, { display: 'grid', gridTemplateColumns: params.inProgress ? '1fr' : '1fr 1fr', gap: '10px' });",
              "    Object.assign(actions.style, { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' });",
            ),
            (
              "    if (!params.inProgress) {\n      const replace = document.createElement('button');",
              "    const replace = document.createElement('button');",
            ),
            (
              "      replace.addEventListener('click', () => finish('replace'));\n      actions.appendChild(replace);\n    }\n\n    const share = document.createElement('button');",
              "    replace.addEventListener('click', () => finish('replace'));\n    actions.appendChild(replace);\n\n    const share = document.createElement('button');",
            ),
            (
              "    setTimeout(() => (params.inProgress ? share : actions.querySelector('button'))?.focus(), 0);",
              "    setTimeout(() => replace.focus(), 0);",
            ),
            (
              "  if (existing.status === 'in_progress') {\n    throw new AssignmentInProgressError(existing.assigned_to);\n  }\n\n  // Replacement is intentionally explicit and race-safe. It only succeeds if\n  // the room still has one cleaner and has not started while the manager was\n  // choosing. If the room changed meanwhile, the manager gets a safe failure\n  // rather than silently overwriting a live/shared assignment.",
              "  // Replacement is intentionally explicit and race-safe. It only succeeds if\n  // the room still has one cleaner. An in-progress replacement transfers the\n  // canonical room job to the new cleaner while keeping started_by/started_at,\n  // so the audit trail still shows who originally opened the room. If the room\n  // became shared while the manager was choosing, the write fails safely.",
            ),
            (
              "    .eq('id', existing.id)\n    .neq('status', 'in_progress')\n    .is('shared_with', null)",
              "    .eq('id', existing.id)\n    .is('shared_with', null)",
            ),
            (
              "  if (fresh?.status === 'in_progress') throw new AssignmentInProgressError(fresh.assigned_to ?? existing.assigned_to);\n  if (fresh?.shared_with) throw new SharedAssignmentFullError(fresh.assigned_to ?? existing.assigned_to, fresh.shared_with);",
              "  if (fresh?.shared_with) throw new SharedAssignmentFullError(fresh.assigned_to ?? existing.assigned_to, fresh.shared_with);",
            ),
            (
              " * - If cleaning has started, replacement is blocked; sharing remains a valid\n *   database operation for callers that do not pre-block active-room drops.",
              " * - If cleaning has started, both choices still work: replacement transfers\n *   the canonical active job; sharing adds the second cleaner to that same job.",
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected helper block: {old[:90]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)

          p2 = Path('src/components/dashboard/HotelRoomOverviewLive.tsx')
          t = p2.read_text()
          old_comment = "  /**\n   * Inverse drag: a housekeeper chip was dropped on a room chip. The write is\n   * immediate (not staged) and refuses to touch a room that is already being\n   * cleaned.\n   */"
          new_comment = "  /**\n   * Inverse drag: a housekeeper chip was dropped on a room chip. Empty rooms\n   * assign immediately; occupied rooms ask the manager whether to replace the\n   * current cleaner or make the room a shared two-housekeeper cleaning job.\n   */"
          if old_comment in t:
              t = t.replace(old_comment, new_comment, 1)
          p2.write_text(t)
          PY

      - name: Build branch
        run: |
          npm install --no-package-lock --ignore-scripts
          npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-shared-room-choice-fix.yml

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/hkAssignmentDnd.ts src/components/dashboard/HotelRoomOverviewLive.tsx .github/workflows/one-time-shared-room-choice-fix.yml
          git commit -m "fix(housekeeping): honor replace or share for every occupied drop"
          git push origin HEAD:feature/shared-housekeeping-rooms
