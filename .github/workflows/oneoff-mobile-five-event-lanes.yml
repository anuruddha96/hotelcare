name: One-off mobile revenue event lanes

on:
  push:
    branches:
      - fix/mobile-revenue-five-event-lanes-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-revenue-five-event-lanes-20260930
          fetch-depth: 0

      - name: Patch Revenue event lanes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/revenue/RateStrategyGrid.tsx')
          s = path.read_text()

          geometry_pattern = re.compile(
              r'(?ms)^\s*// Reserve five readable lanes whenever Events is open\..*?^\s*const EVENT_ROW_H = showEventBand \? Math\.max\(ROW_H \* 3, EVENT_LANE_H \* 5 \+ 12\) : ROW_H;'
          )
          geometry_replacement = '''  // Five compact event lanes. Real in-flow lane spacers below own the DOM
            // height so iOS/WebKit cannot collapse the Events section back to one line.
            const EVENT_LANE_H = Math.max(19, Math.min(26, Math.round(22 * zoom)));
            const EVENT_ROW_H = showEventBand ? EVENT_LANE_H * 5 : ROW_H;'''
          s, count = geometry_pattern.subn(geometry_replacement, s, count=1)
          assert count == 1, f'event geometry anchor count={count}'

          old_outer = 'style={{ height: EVENT_ROW_H, minHeight: EVENT_ROW_H }}'
          assert old_outer in s, 'event outer row anchor not found'
          s = s.replace(old_outer, 'style={{ minHeight: EVENT_ROW_H }}', 1)

          canvas_anchor = '''                    <div
                      className="relative shrink-0 overflow-hidden bg-card"
                      style={{ width: dates.length * CELL_W, height: "100%" }}
                    >
                      {/* Date-column background stays visible underneath the merged bars. */}'''
          canvas_replacement = '''                    <div
                      className="relative shrink-0 overflow-hidden bg-card"
                      style={{ width: dates.length * CELL_W }}
                    >
                      {/* Five real in-flow rows prevent mobile WebKit from collapsing the event band. */}
                      <div className="pointer-events-none flex flex-col" aria-hidden="true">
                        {Array.from({ length: showEventBand ? 5 : 1 }, (_, lane) => (
                          <div
                            key={`event-lane-spacer-${lane}`}
                            className="shrink-0"
                            style={{ height: showEventBand ? EVENT_LANE_H : ROW_H }}
                          />
                        ))}
                      </div>

                      {/* Date-column background stays visible underneath the merged bars. */}'''
          assert canvas_anchor in s, 'event canvas anchor not found'
          s = s.replace(canvas_anchor, canvas_replacement, 1)

          path.write_text(s)
          PY
          git diff --check

      - name: Verify focused event-band tests
        shell: bash
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx vitest run src/lib/revenueEventBands.test.ts
          npm run build

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-mobile-five-event-lanes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-mobile-five-event-lanes.yml
          git commit -m "fix: render five real mobile revenue event lanes"
          git push origin HEAD:fix/mobile-revenue-five-event-lanes-20260930
