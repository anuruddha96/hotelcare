name: One-shot Memories note loss repair
on:
  push:
    branches: [fix/memories-instruction-loss-note-concurrency-20260920]
    paths: ['.github/workflows/one-shot-memories-note-safety-20260920.yml']
permissions:
  contents: write
jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Fail-closed patch to stop stale note writes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          detail = Path('src/components/dashboard/RoomDetailDialog.tsx')
          quick = Path('src/components/dashboard/RoomOperationsQuickHub.tsx')
          def swap(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(before, after, 1)
          a = detail.read_text()
          a = swap(a, "  const lastSavedNotesRef = useRef('');", "  const lastSavedNotesRef = useRef('');\n  const lastPersistedNotesRef = useRef<string | null>(null);", 'detail persisted ref')
          a = swap(a, "  useEffect(() => {\n    if (open && room) {\n      const initialNotes = room.notes || '';\n      setRoomNotes(initialNotes);\n      lastSavedNotesRef.current = initialNotes;\n      setNotesSaveState('idle');", "  // Initialize a note editor only when opening or switching rooms. A fresh\n  // parent room object must never reset an in-progress draft/autosave.\n  useEffect(() => {\n    if (notesSaveTimerRef.current) {\n      clearTimeout(notesSaveTimerRef.current);\n      notesSaveTimerRef.current = null;\n    }\n    if (!open || !room) return;\n    const initialNotes = room.notes || '';\n    setRoomNotes(initialNotes);\n    lastSavedNotesRef.current = initialNotes;\n    lastPersistedNotesRef.current = room.notes ?? null;\n    setNotesSaveState('idle');\n  }, [open, room?.id]);\n\n  useEffect(() => {\n    if (open && room) {", 'detail initialization')
          a = swap(a, "        notes: roomNotes,\n        room_size_sqm:", "        room_size_sqm:", 'status update must not write stale notes')
          a = swap(a, "      const { data, error } = await (supabase as any).rpc('save_room_note', {\n        p_room_id: room.id,\n        p_notes: nextNotes,\n      });", "      const { data, error } = await (supabase as any).rpc('save_room_note_if_unchanged', {\n        p_room_id: room.id,\n        p_notes: nextNotes,\n        p_expected_notes: lastPersistedNotesRef.current,\n      });", 'detail RPC CAS')
          a = swap(a, "      lastSavedNotesRef.current = nextNotes;\n      setNotesSaveState('saved');", "      lastSavedNotesRef.current = nextNotes;\n      lastPersistedNotesRef.current = savedRow.notes ?? null;\n      setNotesSaveState('saved');", 'detail CAS baseline')
          a = swap(a, "'Autosave failed — tap outside to retry'", "'Save blocked — refresh to review latest room notes before retrying'", 'detail error message')
          detail.write_text(a)
          b = quick.read_text()
          b = swap(b, "      const { error } = await supabase.from('rooms').update(patch as any).eq('id', selection.roomId);\n      if (error) throw error;\n      setSelection((current) => current ? { ...current, ...localPatch } : current);", "      let query = supabase.from('rooms').update(patch as any).eq('id', selection.roomId);\n      // Service flag toggles must not overwrite instructions changed in another session.\n      if (Object.prototype.hasOwnProperty.call(patch, 'notes')) {\n        query = selection.roomNotes == null\n          ? query.is('notes', null)\n          : query.eq('notes', selection.roomNotes);\n      }\n      const { data, error } = await query.select('id, notes').maybeSingle();\n      if (error) throw error;\n      if (!data) throw new Error('Room notes changed. Refresh and review the latest instructions.');\n      setSelection((current) => current ? { ...current, ...localPatch, roomNotes: data.notes ?? null } : current);", 'quick patch CAS')
          b = swap(b, "      const { error } = await supabase.from('rooms').update({ notes: nextNotes || null } as any).eq('id', selection.roomId);\n      if (error) throw error;", "      const { data, error } = await (supabase as any).rpc('save_room_note_if_unchanged', {\n        p_room_id: selection.roomId,\n        p_notes: nextNotes,\n        p_expected_notes: selection.roomNotes,\n      });\n      if (error) throw error;\n      const savedRow = Array.isArray(data) ? data[0] : data;\n      if (!savedRow?.room_id) throw new Error('Room note update was not applied');", 'quick note CAS')
          before = "      const trimmed = notesDraft.trim();\n      if (trimmed) {\n        const { error: historyError } = await supabase.from('housekeeping_notes').insert({\n          room_id: selection.roomId,\n          assignment_id: selection.assignmentId,\n          note_type: 'general',\n          content: trimmed,\n          created_by: profile.id,\n          organization_slug: profile.organization_slug || null,\n        } as any);\n        if (historyError) console.warn('Note saved but history insert failed', historyError);\n      }\n\n"
          b = swap(b, before, "      // The database note-history trigger records this edit atomically.\n", 'remove duplicate manual audit')
          b = swap(b, "{ ...current, roomNotes: nextNotes || null }", "{ ...current, roomNotes: savedRow.notes ?? null }", 'quick saved actual note')
          b = swap(b, "      toast.error('Could not save the note.');", "      toast.error((error as any)?.message || 'Could not save the note.');", 'quick show conflict')
          quick.write_text(b)
          test = Path('src/lib/__tests__/memoriesNoteLossSafety.test.ts')
          test.write_text('''import { describe, expect, it } from 'vitest';\nimport { readFileSync } from 'node:fs';\n\nconst detail = readFileSync('src/components/dashboard/RoomDetailDialog.tsx', 'utf8');\nconst quick = readFileSync('src/components/dashboard/RoomOperationsQuickHub.tsx', 'utf8');\nconst migration = readFileSync('supabase/migrations/20260920105000_memories_preserve_notes_and_cas.sql', 'utf8');\n\ndescribe('manager room instructions must not be silently erased', () => {\n  it('uses compare-and-swap in both note editors', () => {\n    expect(detail).toContain("rpc('save_room_note_if_unchanged'");\n    expect(detail).toContain('p_expected_notes: lastPersistedNotesRef.current');\n    expect(quick).toContain("rpc('save_room_note_if_unchanged'");\n    expect(quick).toContain('p_expected_notes: selection.roomNotes');\n  });\n  it('status changes cannot write stale notes and draft does not reset on room prop refresh', () => {\n    const status = detail.split('const handleStatusChange =')[1].split('const handleSaveNotes =')[0];\n    expect(status).not.toContain('notes: roomNotes');\n    expect(detail).toContain('}, [open, room?.id]);');\n  });\n  it('flag toggles reject competing note changes', () => {\n    expect(quick).toContain("Object.prototype.hasOwnProperty.call(patch, 'notes')");\n    expect(quick).toContain("query.eq('notes', selection.roomNotes)");\n    expect(quick).toContain('if (!data) throw new Error');\n  });\n  it('database guards same-stay PMS refresh and rejects stale note edits', () => {\n    expect(migration).toContain('hotelcare_guard_memories_notes_on_refresh');\n    expect(migration).toContain('r.notes IS NOT DISTINCT FROM p_expected_notes');\n    expect(migration).toContain('NEW.pms_metadata');\n  });\n});\n''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Remove this temporary workflow and commit verified repair
        run: |
          rm .github/workflows/one-shot-memories-note-safety-20260920.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dashboard/RoomDetailDialog.tsx src/components/dashboard/RoomOperationsQuickHub.tsx src/lib/__tests__/memoriesNoteLossSafety.test.ts .github/workflows/one-shot-memories-note-safety-20260920.yml
          git commit -m 'Prevent stale note autosave, status and QuickHub writes'
          git push origin HEAD:fix/memories-instruction-loss-note-concurrency-20260920
