name: PMS global refresh queue CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/pmsRefreshQueue*'
      - 'src/contexts/LiveSyncContext.tsx'
      - 'src/components/dashboard/PmsRefreshButton.tsx'
      - 'src/components/pms/Pms*'
      - 'supabase/functions/hotelcare-pms-morning-sequence/**'
      - 'supabase/functions/previo-pms-sync/**'
      - 'supabase/functions/pms-refresh-queue-worker/**'
      - 'supabase/migrations/*global_pms_refresh_queue.sql'
      - '.github/workflows/pms-global-refresh-queue-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test src/lib/pmsRefreshQueue.test.ts
      - run: bun run build
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/hotelcare-pms-morning-sequence/index.ts
      - run: deno check supabase/functions/previo-pms-sync/core.ts
      - run: deno check supabase/functions/pms-refresh-queue-worker/index.ts
