name: Patch period-aware sales goals

on:
  push:
    branches:
      - fix/period-aware-sales-goals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/period-aware-sales-goals
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_period_aware_goals.py
      - name: Commit patched component
        run: |
          rm .github/workflows/zz-patch-period-aware-goals.yml
          rm scripts/patch_period_aware_goals.py
          git config user.name hotelcare-bot
          git config user.email actions@users.noreply.github.com
          git add src/components/revenue/TodaysSalesAdrGoal.tsx .github/workflows/zz-patch-period-aware-goals.yml scripts/patch_period_aware_goals.py
          git commit -m "Make sales goals period-aware and fix target saves"
          git push origin HEAD:fix/period-aware-sales-goals
