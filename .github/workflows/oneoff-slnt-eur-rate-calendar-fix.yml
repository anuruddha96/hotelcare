name: One-off SLNT EUR rate calendar fix

on:
  push:
    branches:
      - fix/slnt-eur-rate-calendar-20260929

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rate calendar currency display
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/revenue/RateStrategyGrid.tsx')
          text = path.read_text()

          old_import = 'import { getRevenueCurrency, moneyBase, useRevenueCurrency } from "@/lib/revenueCurrency";'
          new_import = 'import { convert, getRevenueCurrency, moneyBase, useRevenueCurrency } from "@/lib/revenueCurrency";'
          if old_import not in text:
              raise SystemExit('Expected revenueCurrency import was not found')
          text = text.replace(old_import, new_import, 1)

          old_price_label = '''/** Compact money for a 60px column; the exact figure lives in the tooltip. */
          function priceLabel(v: number): string {
            if (Math.abs(v) >= 10000) {
              const k = v / 1000;
              return `${(Math.abs(k) >= 100 ? Math.round(k) : Math.round(k * 10) / 10).toString().replace(".", ",")}k`;
            }
            return eur(v);
          }'''
          new_price_label = '''/** Compact money for a 60px column; the exact figure lives in the tooltip. */
          function priceLabel(v: number): string {
            // The compact threshold must be evaluated in the currency the user
            // is actually viewing. SLNT stores HUF, so checking the raw value
            // first made 38,900 HUF stay as "38,9k" even after switching to EUR.
            const displayed = convert(v);
            if (displayed !== null && Math.abs(displayed) >= 10000) {
              const k = displayed / 1000;
              return `${(Math.abs(k) >= 100 ? Math.round(k) : Math.round(k * 10) / 10).toString().replace(".", ",")}k`;
            }
            return eur(v);
          }'''
          if old_price_label not in text:
              raise SystemExit('Expected priceLabel block was not found')
          text = text.replace(old_price_label, new_price_label, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/oneoff-slnt-eur-rate-calendar-fix.yml')
          workflow.unlink()
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-slnt-eur-rate-calendar-fix.yml
          git commit -m "fix: convert SLNT rate calendar to selected currency"
          git push
