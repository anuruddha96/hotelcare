name: One-off deploy checkout alias fix

on:
  push:
    branches:
      - deploy/checkout-alias-auth
    paths:
      - .github/workflows/one-off-deploy-checkout-alias.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged HotelCare code
        uses: actions/checkout@v4
        with:
          ref: 0ce10b31ed2e52c15e1d40cbe219087ebdd7e226

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy previo-poll-checkouts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is not configured."
            exit 2
          fi
          supabase functions deploy previo-poll-checkouts \
            --project-ref pcmszqqklkolvvlabohq \
            --no-verify-jwt
