name: Maintenance property collaboration SQL CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261005090000_maintenance_property_team_collaboration.sql'
      - 'supabase/tests/maintenance_team_collaboration_*.sql'
      - '.github/workflows/maintenance-team-collaboration-sql-ci.yml'

permissions:
  contents: read

jobs:
  maintenance-team-collaboration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_maintenance_team_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_maintenance_team_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test same-property collaboration and isolation
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/maintenance_team_collaboration_fixture.sql \
            -f supabase/migrations/20261005090000_maintenance_property_team_collaboration.sql \
            -f supabase/tests/maintenance_team_collaboration_test.sql
