name: Apply Open issue notification UX once
on:
  push:
    branches: [fix/maintenance-open-created-issue-298-20260922]
    paths:
      - '.github/workflows/maintenance-298-open-issue-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maintenance-open-created-issue-298-20260922
          persist-credentials: true
      - name: Apply exact-match UX change and remove temporary tooling
        run: |
          set -euo pipefail
          python3 scripts/maintenance_open_issue_298.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: open newly reported maintenance issue from success notification (#298)'
          git push origin HEAD:fix/maintenance-open-created-issue-298-20260922
