name: One-shot maintenance issue opening UX
on:
  push:
    branches: [fix/maintenance-open-created-issue-298-20260922]
    paths: [.github/workflows/maintenance-298-open-issue-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maintenance-open-created-issue-298-20260922
          persist-credentials: true
      - name: Apply exact-match UX change and remove temporary workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
              p=Path(path)
              text=p.read_text()
              assert text.count(old)==1,(path,old[:100],text.count(old))
              p.write_text(text.replace(old,new))
          c='src/components/dashboard/CreateTicketDialog.tsx'
          replace(c,"import { toast } from '@/hooks/use-toast';", "import { toast } from '@/hooks/use-toast';\nimport { ToastAction } from '@/components/ui/toast';")
          replace(c,'interface CreateTicketDialogProps { open: boolean; onOpenChange: (open: boolean) => void; onTicketCreated: () => void }','interface CreateTicketDialogProps { open: boolean; onOpenChange: (open: boolean) => void; onTicketCreated: () => void; onOpenTicket?: (id: string) => void }')
          replace(c,'export function CreateTicketDialog({ open, onOpenChange, onTicketCreated }: CreateTicketDialogProps)', 'export function CreateTicketDialog({ open, onOpenChange, onTicketCreated, onOpenTicket }: CreateTicketDialogProps)')
          old="      toast({ title: `${c.success} · ${data.ticket_number}`, description: data.assigned_to ? `${c.assigned}: ${assigneeName || 'Maintenance'}` : c.queued });"
          new="      toast({ title: `${c.success} · ${data.ticket_number}`, description: data.assigned_to ? `${c.assigned}: ${assigneeName || 'Maintenance'}` : c.queued,\n        action: onOpenTicket && formData.department === 'maintenance' ? <ToastAction altText=\"Open issue\" onClick={() => onOpenTicket(data.id)}>{language === 'hu' ? 'Hiba megnyitása' : 'Open issue'}</ToastAction> : undefined,\n      });"
          replace(c,old,new)
          old="        onTicketCreated(); reset(); onOpenChange(false); toast({ title: `${c.success} · ${savedTicket.ticket_number}` });"
          new="        onTicketCreated(); reset(); onOpenChange(false); toast({ title: `${c.success} · ${savedTicket.ticket_number}`,\n          action: onOpenTicket ? <ToastAction altText=\"Open issue\" onClick={() => onOpenTicket(savedTicket!.id)}>{language === 'hu' ? 'Hiba megnyitása' : 'Open issue'}</ToastAction> : undefined,\n        });"
          replace(c,old,new)
          dashboard='src/components/dashboard/Dashboard.tsx'
          marker='  const searchClosedTickets = async (searchTerm: string) => {'
          impl='''  // Open the saved issue by its immutable UUID, not by room or a stale list filter.
  // Supabase RLS enforces the caller's authorized hotel and organization.
  const openCreatedMaintenanceIssue = async (ticketId: string) => {
    if (!profile?.organization_slug) return;
    const { data, error } = await (supabase as any).from('tickets')
      .select(`*, created_by_profile:profiles!tickets_created_by_fkey(full_name, role), assigned_to_profile:profiles!tickets_assigned_to_fkey(full_name, role), closed_by_profile:profiles!tickets_closed_by_fkey(full_name, role)`)
      .eq('id', ticketId).eq('organization_slug', profile.organization_slug)
      .eq('department', 'maintenance').maybeSingle();
    if (error || !data) {
      toast({ title: language === 'hu' ? 'Nem sikerült megnyitni a hibát' : 'Could not open issue',
        description: error?.message || 'Check your hotel permissions and refresh the issue list.', variant: 'destructive' });
      return;
    }
    setSelectedTicket({
      id: data.id, ticket_number: data.ticket_number, title: data.title,
      description: data.description, room_number: data.room_number,
      priority: data.priority, status: data.status, on_hold: data.on_hold,
      hold_reason: data.hold_reason, sla_due_date: data.sla_due_date,
      created_at: data.created_at, updated_at: data.updated_at,
      department: data.department, hotel: data.hotel, attachment_urls: data.attachment_urls,
      completion_photos: data.completion_photos, resolution_text: data.resolution_text,
      closed_at: data.closed_at, pending_supervisor_approval: data.pending_supervisor_approval,
      created_by: data.created_by_profile ? { full_name: data.created_by_profile.full_name, role: data.created_by_profile.role } : undefined,
      assigned_to: data.assigned_to_profile ? { full_name: data.assigned_to_profile.full_name } : undefined,
    });
  };

'''
          replace(dashboard,marker,impl+marker)
          replace(dashboard,'          onTicketCreated={fetchTickets}\n', '          onTicketCreated={fetchTickets}\n          onOpenTicket={id => void openCreatedMaintenanceIssue(id)}\n')
          Path('.github/workflows/maintenance-298-open-issue-once.yml').unlink()
          print('Added authenticated Open issue toast action and removed one-shot workflow.')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: open newly reported maintenance issue from success notification (#298)'
          git push origin HEAD:fix/maintenance-open-created-issue-298-20260922
