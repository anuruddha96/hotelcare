name: Temporary PMS midnight patch and verification

on:
  push:
    branches: [fix/budapest-midnight-pms-283]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: ${{ !contains(github.event.head_commit.message, 'apply validated Budapest midnight source patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fail-closed source patch
        run: python3 scripts/patch-pms-midnight-283.py
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run regression and full unit tests
        run: bun run test
      - name: Build production app
        run: bun run build
      - name: Commit the verified fix to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/budapestTime.ts src/lib/pmsRefresh.ts src/contexts/LiveSyncContext.tsx supabase/functions/previo-pms-sync/core.ts supabase/functions/previo-poll-checkouts/core.ts
          git diff --cached --check
          git diff --cached --quiet && { echo "No source patch staged"; exit 1; }
          git commit -m "fix(pms): apply validated Budapest midnight source patch (#283)"
          git push origin HEAD:fix/budapest-midnight-pms-283
