name: One-shot Gozsdu canonical labels and Laundryner UX
on:
  push:
    branches:
      - fix/gozsdu-full-names-building-ux-20260916
permissions:
  contents: write
jobs:
  apply-verify-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-anchor Gozsdu-only patch
        run: python3 scripts/.temporary_gozsdu_room_ui_patch.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Focused Gozsdu tests
        run: bunx vitest run src/lib/gozsduRoomRegistryDisplay.test.ts src/lib/gozsduBuildingAssignment.test.ts src/lib/gozsduVerifiedAutoAssign.test.ts src/lib/gozsduLaundryAssignment.test.ts
      - name: Full regression suite
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Commit only validated source and remove temporary patch tooling
        run: |
          git rm .github/workflows/gozsdu-room-ui-one-shot.yml scripts/.temporary_gozsdu_room_ui_patch.py
          git add src/components/dashboard/HousekeepingRoomSettings.tsx src/components/dashboard/GozsduLaundryDutyPicker.tsx src/components/dashboard/AutoRoomAssignmentImpl.tsx src/components/dashboard/HotelFloorMap.tsx src/lib/gozsduVerifiedAutoAssign.ts
          git -c user.name='HotelCare CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix(gozsdu): show full PMS apartment names and building groups; keep Laundryner editor mounted'
          git push origin HEAD:fix/gozsdu-full-names-building-ux-20260916
