name: Apply housekeeping recheck clarity fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-housekeeping-recheck-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patch
        run: python scripts/apply_housekeeping_recheck_fix.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          rm -f .github/workflows/apply-housekeeping-recheck-fix.yml
          rm -f scripts/apply_housekeeping_recheck_fix.py
          git config user.name "HotelCare Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/dashboard/SupervisorApprovalView.tsx src/components/dashboard/AssignedRoomCard.tsx .github/workflows/apply-housekeeping-recheck-fix.yml scripts/apply_housekeeping_recheck_fix.py
          git commit -m "fix: explain supervisor-rejected housekeeping reassignments"
          git push
