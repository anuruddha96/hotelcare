name: Patch Reception Legacy Tab

on:
  push:
    branches: [unify-reception-reservations-previo-ui]
    paths: ['.github/workflows/patch-reception-tab.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unify-reception-reservations-previo-ui
      - name: Route legacy Reception tab to unified workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/dashboard/Dashboard.tsx')
          s = p.read_text()
          old = '''                <TabsTrigger value="rooms" className="shrink-0 whitespace-nowrap flex items-center justify-center gap-1 sm:gap-2 text-[11px] sm:text-sm px-2 sm:px-3" data-training="rooms-tab">
                  <Home className="h-3 w-3 sm:h-4 sm:w-4 flex-shrink-0" />
                  <span>Reception</span>
                </TabsTrigger>'''
          new = '''                <button
                  type="button"
                  onClick={() => navigate(`/${organizationSlug || 'rdhotels'}/reception`)}
                  className="shrink-0 whitespace-nowrap inline-flex items-center justify-center gap-1 sm:gap-2 rounded-md px-2 sm:px-3 py-1.5 text-[11px] sm:text-sm font-medium text-muted-foreground hover:text-foreground hover:bg-background/60 transition-colors"
                  data-training="rooms-tab"
                >
                  <Home className="h-3 w-3 sm:h-4 sm:w-4 flex-shrink-0" />
                  <span>Reception</span>
                </button>'''
          if old not in s:
              raise SystemExit('Expected manager Reception tab block not found; refusing broad edit')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/Dashboard.tsx
          git commit -m "Route legacy Reception tab to unified workspace"
          git push
