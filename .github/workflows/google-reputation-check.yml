name: Google Reputation Check

on:
  pull_request:
    paths:
      - "src/pages/Reputation.tsx"
      - "src/lib/googleBusinessSetup.ts"
      - "src/lib/googleBusinessSetup.test.ts"
      - "supabase/functions/google-reputation/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/google-reputation-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test Google setup diagnostics
        run: npm test -- src/lib/googleBusinessSetup.test.ts

      - name: Build application
        run: npm run build
