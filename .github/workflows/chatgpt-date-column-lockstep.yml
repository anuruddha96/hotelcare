name: Apply ChatGPT date-column lockstep patch

on:
  push:
    branches:
      - chatgpt/date-column-lockstep
    paths:
      - '.github/date-column-lockstep.patch'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/date-column-lockstep
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply exact-match source patch
        run: python .github/date-column-lockstep.patch

      - name: Run Revenue Engine V2 regression tests
        run: deno test supabase/functions/_shared/engineV2*_test.ts

      - name: Verify production build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit verified change and remove temporary patch workflow
        run: |
          rm .github/date-column-lockstep.patch
          rm .github/workflows/chatgpt-date-column-lockstep.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(revenue): move Engine V2 pricing by date column"
          git push origin HEAD:chatgpt/date-column-lockstep
