name: Apply unified tomorrow Auto Assign patch

on:
  push:
    branches:
      - feat/unified-tomorrow-auto-assign
    paths:
      - '.github/workflows/apply-unified-tomorrow-autoassign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-tomorrow-auto-assign
          fetch-depth: 0
      - name: Apply source patches
        run: |
          python3 scripts/apply-unified-tomorrow-autoassign.py
          python3 scripts/patch-auto-room-wrapper.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-unified-tomorrow-autoassign.py
          rm scripts/patch-auto-room-wrapper.py
          rm .github/workflows/apply-unified-tomorrow-autoassign.yml
      - name: Commit patched sources
        run: |
          git config user.name 'hotelcare-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify tomorrow planning with Auto Room Assignment UI'
          git push origin HEAD:feat/unified-tomorrow-auto-assign
