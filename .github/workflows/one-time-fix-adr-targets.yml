name: One-time ADR target fix

on:
  push:
    branches:
      - fix/manual-adr-targets-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-adr-targets-only
      - name: Prevent automatic ADR goal changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/revenue/TodaysSalesAdrGoal.tsx')
          text = path.read_text()

          old_state = '  const [goalsSeeded, setGoalsSeeded] = useState(false);'
          if old_state not in text:
              raise SystemExit('Expected goalsSeeded state declaration not found')
          text = text.replace(old_state, '  const [, setGoalsSeeded] = useState(false);', 1)

          start_marker = '  // First visit for a property: seed the target from what it actually sells,'
          end_marker = '\n\n  const kpi = useMemo(() => {'
          start = text.find(start_marker)
          if start == -1:
              raise SystemExit('Automatic ADR seed block start not found')
          end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Automatic ADR seed block end not found')

          replacement = (
              '  // Revenue goals are management inputs. Booking data must never infer, overwrite,\n'
              '  // or persist ADR/room-night/value targets automatically. If a shared target has\n'
              '  // not been configured yet, the UI keeps the existing/default value until a\n'
              '  // manager explicitly changes it in the Goals controls.\n'
          )
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Remove one-time workflow and commit fix
        run: |
          rm .github/workflows/one-time-fix-adr-targets.yml
          git config user.name "hotelcare-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/revenue/TodaysSalesAdrGoal.tsx .github/workflows/one-time-fix-adr-targets.yml
          git commit -m "Prevent automatic ADR target changes"
          git push origin HEAD:fix/manual-adr-targets-only
