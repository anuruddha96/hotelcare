name: One-off SLNT room availability fix

on:
  push:
    branches:
      - fix/slnt-room-type-availability-20260929

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch per-room-type availability
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/RevenueHotelDetail.tsx')
          text = path.read_text()
          old = '      if (rt.is_sellable === false) continue;'
          new = '      if (!rt.pms_room_id || (rt.num_rooms || 0) <= 0) continue;'
          if old not in text:
              raise SystemExit('Expected availability filter was not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/oneoff-slnt-room-availability-fix.yml').unlink()
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/RevenueHotelDetail.tsx .github/workflows/oneoff-slnt-room-availability-fix.yml
          git commit -m "fix: show SLNT room-type availability in rate calendar"
          git push
