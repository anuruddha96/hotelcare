name: One-off rich revenue event glance v2

on:
  push:
    branches:
      - fix/revenue-rich-event-glance-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-rich-event-glance-20260930
          fetch-depth: 0

      - name: Restore native rich event cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app-entry.tsx')
          app_text = app.read_text()
          for line in [
              'import "./styles/rate-calendar-mobile-events-polish.css";\n',
              'import { installRateCalendarMobileEvents } from "@/lib/rateCalendarMobileEvents";\n',
              'installRateCalendarMobileEvents();\n',
          ]:
              app_text = app_text.replace(line, '')
          app.write_text(app_text)

          p = Path('src/components/revenue/RateStrategyGrid.tsx')
          text = p.read_text()

          old_import = 'import { Loader2, CalendarRange, ChevronDown, Info, AlertTriangle, Send, History, SlidersHorizontal, Maximize2, Minimize2, ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UserRound, UsersRound } from "lucide-react";'
          new_import = 'import { Loader2, CalendarRange, ChevronDown, Info, AlertTriangle, Send, History, SlidersHorizontal, Maximize2, Minimize2, ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UserRound, UsersRound, Eye } from "lucide-react";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise AssertionError('Unexpected lucide import')

          helper_anchor = '\n\n/** Small info bubble that works on hover and on touch. */'
          helper = r'''

/** Compact date range for an event chip. The month is already visible in the
 * calendar header, so the chip can spend most of its width on the event name. */
function compactEventRange(event: DemandEventDetail, fallbackDate: string): string {
  const parse = (value?: string | null) => {
    const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(value ?? "");
    if (!match) return null;
    return {
      iso: `${match[1]}-${match[2]}-${match[3]}`,
      month: Number(match[2]),
      day: Number(match[3]),
    };
  };
  const start = parse(event.start) ?? parse(fallbackDate);
  const end = parse(event.end) ?? start;
  if (!start || !end) return "";
  if (start.iso === end.iso) return String(start.day);
  if (start.month === end.month) return `${start.day}–${end.day}`;
  const initials = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
  return `${start.day}${initials[start.month - 1] ?? ""}–${end.day}${initials[end.month - 1] ?? ""}`;
}
'''
          if 'function compactEventRange(' not in text:
              assert helper_anchor in text, 'helper anchor changed'
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          text = text.replace(
              'The calendar shows the four strongest signals for each night;',
              'The calendar shows the five strongest signals for each night;',
              1,
          )
          text = text.replace('Math.round(74 * zoom)', 'Math.round(86 * zoom)', 1)

          old_button = 'className={`shrink-0 overflow-hidden px-0.5 py-0.5 text-left hover:ring-1 hover:ring-inset hover:ring-primary/50 ${dayBg(d, i)} ${dayEdge(d)}`}'
          new_button = 'className={`relative shrink-0 overflow-hidden px-0.5 py-0.5 text-left hover:ring-1 hover:ring-inset hover:ring-primary/50 ${dayBg(d, i)} ${dayEdge(d)}`}'
          if old_button in text:
              text = text.replace(old_button, new_button, 1)
          elif new_button not in text:
              raise AssertionError('event button class changed')

          old_map = 'all.map((e, n) => `${n + 1}. ${e.title} — ${e.impact} impact`)'
          new_map = 'all.map((e, n) => `${n + 1}. ${e.start ?? d}${e.end && e.end !== e.start ? ` → ${e.end}` : ""} · ${e.title} — ${e.impact} impact`)'
          if old_map in text:
              text = text.replace(old_map, new_map, 1)

          old_stack_open = '<div className="flex h-full flex-col gap-px overflow-hidden">\n                            {visible.map((e, n) => {'
          new_stack_open = '''<div className="relative flex h-full flex-col gap-px overflow-hidden">
                            {visible.length > 0 && (
                              <Eye
                                className="pointer-events-none absolute right-0.5 top-0.5 z-10 h-2.5 w-2.5 rounded-sm bg-card/85 p-[1px] text-foreground/70 shadow-sm"
                                aria-hidden="true"
                              />
                            )}
                            {visible.map((e, n) => {'''
          assert old_stack_open in text, 'event stack opener changed'
          text = text.replace(old_stack_open, new_stack_open, 1)

          old_tone_return = ': "border-border bg-muted/60 text-muted-foreground";\n                              return ('
          new_tone_return = ': "border-border bg-muted/60 text-muted-foreground";\n                              const range = compactEventRange(e, d);\n                              return ('
          assert old_tone_return in text, 'event tone block changed'
          text = text.replace(old_tone_return, new_tone_return, 1)

          old_chip_class = 'className={`block truncate rounded-[2px] border px-0.5 font-medium leading-[11px] ${tone}`}'
          new_chip_class = 'className={`flex min-w-0 items-center gap-0.5 rounded-[2px] border px-0.5 font-medium leading-[12px] ${n === 0 ? "pr-2.5" : ""} ${tone}`}'
          assert old_chip_class in text, 'event chip class changed'
          text = text.replace(old_chip_class, new_chip_class, 1)

          old_chip_text = '{impact === "high" ? "H" : impact === "medium" ? "M" : "L"} · {e.title}'
          new_chip_text = '''<span className="shrink-0 font-semibold tracking-[-0.03em]">{range}</span>
                                  <span className="min-w-0 flex-1 truncate">{e.title}</span>'''
          assert old_chip_text in text, 'event chip text changed'
          text = text.replace(old_chip_text, new_chip_text, 1)

          old_more = 'className="block truncate text-center text-[8px] font-semibold text-muted-foreground"'
          new_more = 'className="block truncate text-center text-[8px] font-semibold leading-[9px] text-muted-foreground"'
          text = text.replace(old_more, new_more, 1)

          p.write_text(text)
          PY

          git diff --check

      - name: Commit patch and remove one-off workflows
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-rich-event-glance.yml .github/workflows/oneoff-rich-event-glance-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app-entry.tsx src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-rich-event-glance.yml .github/workflows/oneoff-rich-event-glance-v2.yml
          git commit -m "ui: restore rich top-five event glance cards"
          git push origin HEAD:fix/revenue-rich-event-glance-20260930
