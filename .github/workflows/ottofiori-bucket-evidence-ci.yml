name: Ottofiori checkout evidence guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*ottofiori_bucket*'
      - 'supabase/tests/ottofiori_bucket_evidence_*'
      - '.github/workflows/ottofiori-bucket-evidence-ci.yml'

permissions:
  contents: read

jobs:
  checkout-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_checkout_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_checkout_guard_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Validate resolver evidence, isolation and audit
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/ottofiori_bucket_evidence_fixture.sql \
            -f supabase/migrations/20261009092000_ottofiori_bucket_evidence_audit.sql \
            -f supabase/migrations/20261009092500_ottofiori_bucket_trigger_guard.sql \
            -f supabase/tests/ottofiori_bucket_evidence_integration.sql
