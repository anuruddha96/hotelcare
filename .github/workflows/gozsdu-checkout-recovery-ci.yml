name: Gozsdu checkout recovery CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/previoConfiguredGozsduCheckoutRecovery.ts'
      - 'supabase/functions/_shared/previoConfiguredGozsduCheckoutRecovery.test.ts'
      - 'supabase/functions/_shared/previoGozsduCheckoutRecovery.ts'
      - 'supabase/functions/previo-poll-checkouts/index.ts'
      - '.github/workflows/gozsdu-checkout-recovery-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/previoConfiguredGozsduCheckoutRecovery.ts'
      - 'supabase/functions/_shared/previoConfiguredGozsduCheckoutRecovery.test.ts'
      - 'supabase/functions/_shared/previoGozsduCheckoutRecovery.ts'
      - 'supabase/functions/previo-poll-checkouts/index.ts'
      - '.github/workflows/gozsdu-checkout-recovery-ci.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test configured ID, real departure, missing evidence and in-house guards
        run: node --experimental-strip-types --test supabase/functions/_shared/previoConfiguredGozsduCheckoutRecovery.test.ts
