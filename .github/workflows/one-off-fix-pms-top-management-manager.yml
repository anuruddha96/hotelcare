name: One-off PMS top-management-manager auth fix

on:
  push:
    branches:
      - fix/pms-sync-top-management-manager
    paths:
      - .github/workflows/one-off-fix-pms-top-management-manager.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/pms-sync-top-management-manager

      - name: Patch PMS authorization roles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/functions/previo-pms-sync/index.ts'),
              Path('supabase/functions/previo-poll-checkouts/index.ts'),
          ]
          old = 'const isAdmin = profile?.role === "admin" || profile?.role === "top_management";'
          new = 'const isAdmin = profile?.role === "admin" || profile?.role === "top_management" || profile?.role === "top_management_manager";'

          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected authorization role check not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "hotelcare-github-fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/previo-pms-sync/index.ts supabase/functions/previo-poll-checkouts/index.ts
          git diff --cached --check
          git commit -m "fix: allow top management managers to run PMS sync"
          git push origin HEAD:fix/pms-sync-top-management-manager
