name: Apply desktop housekeeping notes fix

on:
  push:
    branches:
      - fix/desktop-housekeeping-notes-save
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-housekeeping-notes-save

      - name: Apply focused source patch
        run: python3 scripts/apply-desktop-notes-fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-desktop-notes-source
          path: src/components/dashboard/HotelRoomOverview.tsx
          if-no-files-found: error
          retention-days: 1
