name: One-off merged revenue event duration bands

on:
  push:
    branches:
      - fix/revenue-event-duration-bands-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-event-duration-bands-20260930
          fetch-depth: 0
      - name: Apply patch
        run: |
          python .github/scripts/patch-event-bands.py
          git diff --check
      - name: Commit result
        run: |
          rm -f .github/workflows/oneoff-event-duration-bands.yml .github/scripts/patch-event-bands.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-event-duration-bands.yml .github/scripts/patch-event-bands.py
          git commit -m "ui: merge multi-day revenue events across date columns"
          git push origin HEAD:fix/revenue-event-duration-bands-20260930
