name: One-time shared room manager patch

on:
  push:
    branches:
      - feature/shared-housekeeping-rooms
    paths:
      - .github/workflows/one-time-shared-room-manager-patch.yml

permissions:
  contents: write

jobs:
  patch-manager-room-board:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/shared-housekeeping-rooms
          fetch-depth: 0

      - name: Apply shared-room manager UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/dashboard/HotelRoomOverviewLive.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { setRoomDragPayload, readRoomDragPayload, unassignRoom, assignRoomToStaff, setHousekeeperDragPayload, readHousekeeperDragPayload, isAssignmentInProgressError } from '@/lib/hkAssignmentDnd';",
              "import { setRoomDragPayload, readRoomDragPayload, unassignRoom, assignRoomToStaff, setHousekeeperDragPayload, readHousekeeperDragPayload, isAssignmentInProgressError, isSharedAssignmentFullError } from '@/lib/hkAssignmentDnd';",
              'drag helper import',
          )

          replace_once(
              "  assigned_to: string;\n  status: string;",
              "  assigned_to: string;\n  shared_with?: string | null;\n  status: string;",
              'AssignmentData shared_with',
          )

          replace_once(
              ".select('id, room_id, assigned_to, status, assignment_type, started_at, supervisor_approved, ready_to_clean, pms_hold, notes')",
              ".select('id, room_id, assigned_to, shared_with, status, assignment_type, started_at, supervisor_approved, ready_to_clean, pms_hold, notes')",
              'today assignment select',
          )

          replace_once(
              "  const getStaffName = (roomId: string): string | null => {\n    const assignment = assignmentMap.get(roomId);\n    if (!assignment) return null;\n    return assigneeLabel(staffMap, assignment.assigned_to);\n  };",
              "  const getStaffName = (roomId: string): string | null => {\n    const assignment = assignmentMap.get(roomId);\n    if (!assignment) return null;\n    const primary = assigneeLabel(staffMap, assignment.assigned_to);\n    const shared = assignment.shared_with ? assigneeLabel(staffMap, assignment.shared_with) : null;\n    return [primary, shared].filter(Boolean).join(' + ') || null;\n  };\n\n  const getStaffTitle = (roomId: string): string | null => {\n    const assignment = assignmentMap.get(roomId);\n    if (!assignment) return null;\n    const primary = cleanName(staffMap[assignment.assigned_to]) || null;\n    const shared = assignment.shared_with ? (cleanName(staffMap[assignment.shared_with]) || null) : null;\n    return [primary, shared].filter(Boolean).join(' + ') || null;\n  };",
              'staff label helpers',
          )

          old_handler = """    const assignment = assignmentMap.get(room.id);\n    const currentName = assignment ? (staffMap[assignment.assigned_to] || null) : null;\n\n    if (assignment?.status === 'in_progress') {\n      toast.warning(\n        `Room ${room.room_number} is currently being cleaned by ${cleanName(currentName) || 'another housekeeper'}. ` +\n        `This assignment cannot be changed while cleaning is in progress. Please contact ${cleanName(currentName) || 'them'} directly.`,\n        { duration: 8000 },\n      );\n      return;\n    }\n    if (assignment?.assigned_to === payload.staffId) {\n      toast.info(`Room ${room.room_number} is already assigned to ${cleanName(payload.staffName)}`);\n      return;\n    }\n\n    try {\n      await assignRoomToStaff({\n        roomId: room.id,\n        staffId: payload.staffId,\n        assignmentDate: selectedDate,\n        assignedBy: profile?.id ?? '',\n        organizationSlug: (profile as any)?.organization_slug ?? null,\n        isCheckoutRoom: isCheckoutBucket(room),\n      });\n      setHkSuccessRoomId(room.id);\n      setTimeout(() => setHkSuccessRoomId((id) => (id === room.id ? null : id)), 1200);\n      toast.success(`${room.room_number} → ${cleanName(payload.staffName)}`);\n      await fetchData(true);\n      window.dispatchEvent(new CustomEvent('hk-assignments-changed'));\n    } catch (err) {\n      if (isAssignmentInProgressError(err)) {\n        const name = cleanName(staffMap[err.currentAssigneeId ?? ''] || currentName || '');\n        toast.warning(\n          `Room ${room.room_number} is currently being cleaned by ${name || 'another housekeeper'}. ` +\n          `This assignment cannot be changed while cleaning is in progress. Please contact ${name || 'them'} directly.`,\n          { duration: 8000 },\n        );\n        return;\n      }\n      console.error('Housekeeper drop assignment failed', err);\n      toast.error('Could not assign this room. Please try again.');\n    }\n"""

          new_handler = """    const assignment = assignmentMap.get(room.id);\n    const currentName = assignment ? (staffMap[assignment.assigned_to] || null) : null;\n\n    if (assignment?.assigned_to === payload.staffId || assignment?.shared_with === payload.staffId) {\n      toast.info(`Room ${room.room_number} is already assigned to ${cleanName(payload.staffName)}`);\n      return;\n    }\n\n    try {\n      // assignRoomToStaff is intentionally interactive for a real housekeeper\n      // drag. If this room already has one cleaner it asks the manager to choose\n      // Replace or Work together before any write is made.\n      await assignRoomToStaff({\n        roomId: room.id,\n        staffId: payload.staffId,\n        assignmentDate: selectedDate,\n        assignedBy: profile?.id ?? '',\n        organizationSlug: (profile as any)?.organization_slug ?? null,\n        isCheckoutRoom: isCheckoutBucket(room),\n      });\n      setHkSuccessRoomId(room.id);\n      setTimeout(() => setHkSuccessRoomId((id) => (id === room.id ? null : id)), 1200);\n      toast.success(`Room ${room.room_number} assignment updated for ${cleanName(payload.staffName)}`);\n      await fetchData(true);\n      window.dispatchEvent(new CustomEvent('hk-assignments-changed'));\n    } catch (err) {\n      if (isSharedAssignmentFullError(err)) {\n        const primary = cleanName(staffMap[err.primaryAssigneeId ?? ''] || '');\n        const shared = cleanName(staffMap[err.sharedAssigneeId ?? ''] || '');\n        const names = [primary, shared].filter(Boolean).join(' and ');\n        toast.warning(\n          `Room ${room.room_number} is already shared${names ? ` by ${names}` : ' by two housekeepers'}. Remove or replace one cleaner before adding another.`,\n          { duration: 8000 },\n        );\n        return;\n      }\n      if (isAssignmentInProgressError(err)) {\n        const name = cleanName(staffMap[err.currentAssigneeId ?? ''] || currentName || '');\n        toast.warning(\n          `Room ${room.room_number} is currently being cleaned by ${name || 'another housekeeper'}. ` +\n          `The active cleaner cannot be replaced. Add the new housekeeper as a shared cleaner instead.`,\n          { duration: 8000 },\n        );\n        return;\n      }\n      console.error('Housekeeper drop assignment failed', err);\n      toast.error('Could not update this room assignment. Please try again.');\n    }\n"""
          replace_once(old_handler, new_handler, 'housekeeper drop handler')

          replace_once(
              "      assignedToName: assignment ? staffMap[assignment.assigned_to] ?? null : null,",
              "      assignedToName: assignment ? getStaffName(room.id) : null,",
              'selected unit assignee label',
          )

          replace_once(
              "            assignedToName: assignment ? staffMap[assignment.assigned_to] ?? null : null,",
              "            assignedToName: assignment ? getStaffName(room.id) : null,",
              'room drag payload assignee label',
          )

          replace_once(
              "            <span className=\"text-[9px] text-muted-foreground font-medium leading-tight text-center max-w-[76px] break-words\" title={staffMap[assignment?.assigned_to ?? ''] || staffName || undefined}>\n              {staffName}\n            </span>",
              "            <span className=\"text-[9px] text-muted-foreground font-medium leading-tight text-center max-w-[96px] break-words\" title={getStaffTitle(room.id) || staffName || undefined}>\n              {staffName}\n            </span>",
              'today chip shared names',
          )

          # Venue/group selection paths need the same combined manager label.
          text = text.replace(
              "return a ? staffMap[a.assigned_to] ?? null : null;",
              "return a ? getStaffName(roomId) : null;",
              1,
          )
          text = text.replace(
              "return a ? staffMap[a.assigned_to] ?? null : null;",
              "return a ? getStaffName(r.id) : null;",
              1,
          )
          text = text.replace(
              "assignedToName: a ? staffMap[a.assigned_to] ?? null : null,",
              "assignedToName: a ? getStaffName(r.id) : null,",
              1,
          )

          path.write_text(text)
          PY

      - name: Remove one-time workflow from branch
        run: rm .github/workflows/one-time-shared-room-manager-patch.yml

      - name: Commit manager shared-room UX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/HotelRoomOverviewLive.tsx .github/workflows/one-time-shared-room-manager-patch.yml
          git commit -m "feat(housekeeping): let managers replace or share occupied rooms"
          git push origin HEAD:feature/shared-housekeeping-rooms
