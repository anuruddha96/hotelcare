name: One-time shared room manager patch

on:
  push:
    branches:
      - feature/shared-housekeeping-rooms
    paths:
      - .github/workflows/one-time-shared-room-manager-patch.yml

permissions:
  contents: write

jobs:
  patch-manager-room-board:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/shared-housekeeping-rooms
          fetch-depth: 0

      - name: Apply shared-room manager UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/dashboard/HotelRoomOverviewLive.tsx')
          text = path.read_text()

          old_import = "import { setRoomDragPayload, readRoomDragPayload, unassignRoom, assignRoomToStaff, setHousekeeperDragPayload, readHousekeeperDragPayload, isAssignmentInProgressError } from '@/lib/hkAssignmentDnd';"
          new_import = "import { setRoomDragPayload, readRoomDragPayload, unassignRoom, assignRoomToStaff, setHousekeeperDragPayload, readHousekeeperDragPayload, isAssignmentInProgressError, isSharedAssignmentFullError } from '@/lib/hkAssignmentDnd';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          if "  assigned_to: string;\n  shared_with?: string | null;\n  status: string;" not in text:
              text = text.replace(
                  "  assigned_to: string;\n  status: string;",
                  "  assigned_to: string;\n  shared_with?: string | null;\n  status: string;",
                  1,
              )

          text = text.replace(
              ".select('id, room_id, assigned_to, status, assignment_type, started_at, supervisor_approved, ready_to_clean, pms_hold, notes')",
              ".select('id, room_id, assigned_to, shared_with, status, assignment_type, started_at, supervisor_approved, ready_to_clean, pms_hold, notes')",
              1,
          )

          old_staff = """  const getStaffName = (roomId: string): string | null => {\n    const assignment = assignmentMap.get(roomId);\n    if (!assignment) return null;\n    return assigneeLabel(staffMap, assignment.assigned_to);\n  };"""
          new_staff = """  const getStaffName = (roomId: string): string | null => {\n    const assignment = assignmentMap.get(roomId);\n    if (!assignment) return null;\n    const primary = assigneeLabel(staffMap, assignment.assigned_to);\n    const shared = assignment.shared_with ? assigneeLabel(staffMap, assignment.shared_with) : null;\n    return [primary, shared].filter(Boolean).join(' + ') || null;\n  };"""
          if old_staff in text:
              text = text.replace(old_staff, new_staff, 1)

          new_handler_body = """    const assignment = assignmentMap.get(room.id);\n    const currentName = assignment ? (staffMap[assignment.assigned_to] || null) : null;\n\n    if (assignment?.assigned_to === payload.staffId || assignment?.shared_with === payload.staffId) {\n      toast.info(`Room ${room.room_number} is already assigned to ${cleanName(payload.staffName)}`);\n      return;\n    }\n\n    try {\n      // For an occupied room this call asks the manager to explicitly choose\n      // Replace or Work together before any assignment write is made.\n      await assignRoomToStaff({\n        roomId: room.id,\n        staffId: payload.staffId,\n        assignmentDate: selectedDate,\n        assignedBy: profile?.id ?? '',\n        organizationSlug: (profile as any)?.organization_slug ?? null,\n        isCheckoutRoom: isCheckoutBucket(room),\n      });\n      setHkSuccessRoomId(room.id);\n      setTimeout(() => setHkSuccessRoomId((id) => (id === room.id ? null : id)), 1200);\n      toast.success(`Room ${room.room_number} assignment updated for ${cleanName(payload.staffName)}`);\n      await fetchData(true);\n      window.dispatchEvent(new CustomEvent('hk-assignments-changed'));\n    } catch (err) {\n      if (isSharedAssignmentFullError(err)) {\n        const primary = cleanName(staffMap[err.primaryAssigneeId ?? ''] || '');\n        const shared = cleanName(staffMap[err.sharedAssigneeId ?? ''] || '');\n        const names = [primary, shared].filter(Boolean).join(' and ');\n        toast.warning(\n          `Room ${room.room_number} is already shared${names ? ` by ${names}` : ' by two housekeepers'}. Remove or replace one cleaner before adding another.`,\n          { duration: 8000 },\n        );\n        return;\n      }\n      if (isAssignmentInProgressError(err)) {\n        const name = cleanName(staffMap[err.currentAssigneeId ?? ''] || currentName || '');\n        toast.warning(\n          `Room ${room.room_number} is currently being cleaned by ${name || 'another housekeeper'}. ` +\n          `The active cleaner cannot be replaced. Add the new housekeeper as a shared cleaner instead.`,\n          { duration: 8000 },\n        );\n        return;\n      }\n      console.error('Housekeeper drop assignment failed', err);\n      toast.error('Could not update this room assignment. Please try again.');\n    }"""

          pattern = re.compile(
              r"(  const handleHousekeeperDropOnRoom = async \(e: React\.DragEvent, room: RoomData\) => \{.*?    setHkDrag\(null\);\n\n)(.*?)(\n  \};\n\n\n  const getAssignmentStatus)",
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Could not locate housekeeper drop handler')
          text = text[:match.start()] + match.group(1) + new_handler_body + match.group(3) + text[match.end():]

          # Safety checks: do not commit a partial manager patch.
          required = [
              'isSharedAssignmentFullError',
              'shared_with?: string | null',
              'assigned_to, shared_with, status',
              "const shared = assignment.shared_with ? assigneeLabel",
              'explicitly choose',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Manager patch incomplete: {missing}')

          path.write_text(text)
          PY

      - name: Remove one-time workflow from branch
        run: rm .github/workflows/one-time-shared-room-manager-patch.yml

      - name: Commit manager shared-room UX
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/HotelRoomOverviewLive.tsx .github/workflows/one-time-shared-room-manager-patch.yml
          git commit -m "feat(housekeeping): let managers replace or share occupied rooms"
          git push origin HEAD:feature/shared-housekeeping-rooms
