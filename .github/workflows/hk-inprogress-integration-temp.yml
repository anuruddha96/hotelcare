name: Housekeeping in-progress lock integration (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/housekeeping-smart-regeneration-348'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/housekeeping-smart-regeneration-348
          persist-credentials: true
      - name: Apply guarded in-progress ownership safety patch
        run: |
          if ! grep -q 'const enforcedLocks = new Set' src/components/dashboard/AutoRoomAssignmentImpl.tsx; then
            node scripts/patch-inprogress-348.mjs
            git diff --check
            git config user.name 'hotelcare-dev-automation'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/components/dashboard/AutoRoomAssignmentImpl.tsx
            git commit -m 'fix(housekeeping): never regenerate in-progress or DND retry rooms'
            git push origin HEAD:fix/housekeeping-smart-regeneration-348
          else
            echo 'In-progress lock already applied.'
          fi
