name: Purchase invoice NAV reconciliation CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261117150000_purchase_invoice_nav_reconciliation.sql'
      - 'supabase/rollbacks/20261117150000_purchase_invoice_nav_reconciliation_down.sql'
      - 'supabase/tests/purchase_invoice_nav_*.sql'
      - 'supabase/functions/_shared/purchaseInvoices/**'
      - 'supabase/functions/nav-connection-admin/**'
      - 'supabase/functions/nav-sync/**'
      - 'supabase/functions/reconcile-purchase-invoices/**'
      - 'supabase/functions/pi-daily-summary/**'
      - 'supabase/functions/pi-history-import/**'
      - 'supabase/functions/process-purchase-invoice/**'
      - 'src/test/purchaseInvoices/**'
      - 'src/components/purchase-invoices/**'
      - 'src/pages/PurchaseInvoices.tsx'
      - '.github/workflows/purchase-invoice-nav-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261117150000_purchase_invoice_nav_reconciliation.sql'
      - 'supabase/functions/_shared/purchaseInvoices/**'

concurrency:
  group: purchase-invoice-nav-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql:
    name: Migration, RLS and approval guards (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_pi_nav_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_pi_nav_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Replay the purchase-invoice schema, apply the migration twice and run assertions
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 \
            -f supabase/tests/purchase_invoice_nav_fixture.sql \
            -f supabase/migrations/20260523112117_182e17b3-090b-4f24-bd05-3d1b9d17122f.sql \
            -f supabase/migrations/20260610080305_db74a60a-15a4-4265-bfb6-c6cc1b4c1f27.sql \
            -f supabase/migrations/20260611092555_c1b174e2-93cb-42f6-ba92-0aa3930397ba.sql \
            -f supabase/migrations/20260825171630_071a7f7b-8b89-4ec1-ab7d-153387ab3816.sql \
            -f supabase/migrations/20260825171730_482d875e-cc52-401a-b489-261a47550e9a.sql \
            -f supabase/tests/purchase_invoice_nav_fixture_post.sql
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261117150000_purchase_invoice_nav_reconciliation.sql
          # Idempotency: the migration must re-apply cleanly.
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261117150000_purchase_invoice_nav_reconciliation.sql
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/tests/purchase_invoice_nav_test.sql | tee /tmp/pi-nav-sql.log
          grep -q 'purchase_invoice_nav_test: all assertions passed' /tmp/pi-nav-sql.log
      - name: Rollback and roll forward
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/rollbacks/20261117150000_purchase_invoice_nav_reconciliation_down.sql
          psql -X -q -v ON_ERROR_STOP=1 -f supabase/migrations/20261117150000_purchase_invoice_nav_reconciliation.sql

  unit:
    name: NAV protocol, validation, reconciliation and runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run purchase-invoice tests (synthetic NAV fixtures only)
        run: bunx vitest run src/test/purchaseInvoices

  edge:
    name: Edge Function type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check purchase-invoice functions
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/_shared/purchaseInvoices/*.ts \
            supabase/functions/nav-connection-admin/index.ts \
            supabase/functions/nav-sync/index.ts \
            supabase/functions/reconcile-purchase-invoices/index.ts \
            supabase/functions/pi-daily-summary/index.ts \
            supabase/functions/pi-history-import/index.ts \
            supabase/functions/process-purchase-invoice/index.ts
