name: Memories automatic service SQL CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20260922110000_memories_automatic_service_cycle.sql'
      - 'supabase/tests/memories_service_cycle_*'
      - '.github/workflows/memories-service-cycle-sql-ci.yml'

permissions:
  contents: read

jobs:
  memories-service-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test Memories backend cycle and isolation in a disposable database
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/memories_service_cycle_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260920150000_stop_false_service_completions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260922110000_memories_automatic_service_cycle.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/memories_service_cycle_integration.sql
