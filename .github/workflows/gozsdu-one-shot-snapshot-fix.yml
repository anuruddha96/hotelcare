name: One-shot Gozsdu PMS snapshot fix
on:
  push:
    branches:
      - fix/gozsdu-dated-pms-buckets-tomorrow-20260916
permissions:
  contents: write
jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact Gozsdu-only patch
        run: python3 scripts/.temporary_gozsdu_snapshot_patch.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused Gozsdu regression tests
        run: bunx vitest run src/lib/gozsduPmsRoster.test.ts src/lib/gozsdu-housekeeping.test.ts
      - name: Production build
        run: bun run build
      - name: Full frontend tests
        run: bun run test
      - name: Commit only verified code and tests; remove one-shot patch scaffolding
        run: |
          git rm .github/workflows/gozsdu-one-shot-snapshot-fix.yml scripts/.temporary_gozsdu_snapshot_patch.py
          git add src/lib/gozsduPmsRoster.ts src/lib/gozsduPmsRoster.test.ts src/lib/nextDayAutoAssignBridgeCore.ts src/components/dashboard/GozsduCourtRoomOverview.tsx src/components/dashboard/NextDayAutoRoomAssignmentGate.tsx
          git -c user.name='HotelCare CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix(gozsdu): reconcile dated PMS room buckets and safe tomorrow coverage'
          git push origin HEAD:fix/gozsdu-dated-pms-buckets-tomorrow-20260916
