name: HMB note and final-night SQL CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261020135500_memories_room_notes_and_final_night.sql'
      - 'supabase/tests/memories_oct20_*'
      - '.github/workflows/memories-oct20-sql-ci.yml'
permissions:
  contents: read
jobs:
  memories-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test HMB note preservation, rollover and tenant isolation
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/memories_oct20_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261020135500_memories_room_notes_and_final_night.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/memories_oct20_integration.sql
