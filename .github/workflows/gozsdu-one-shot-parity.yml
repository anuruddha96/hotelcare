name: One-shot Gozsdu cross-hotel parity verification
on:
  push:
    branches:
      - fix/gozsdu-dated-pms-buckets-tomorrow-20260916
permissions:
  contents: write
jobs:
  parity-build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore original non-Gozsdu snapshot-reuse guard
        run: python3 scripts/.temporary_gozsdu_parity_patch.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Gozsdu focused tests
        run: bunx vitest run src/lib/gozsduPmsRoster.test.ts src/lib/gozsdu-housekeeping.test.ts
      - name: Production build
        run: bun run build
      - name: Entire frontend test suite
        run: bun run test
      - name: Commit validated parity correction; remove temporary workflow and script
        run: |
          git rm .github/workflows/gozsdu-one-shot-parity.yml scripts/.temporary_gozsdu_parity_patch.py
          git add src/lib/nextDayAutoAssignBridgeCore.ts
          git -c user.name='HotelCare CI' -c user.email='actions@users.noreply.github.com' commit -m 'test(gozsdu): preserve other-hotel snapshot reuse semantics'
          git push origin HEAD:fix/gozsdu-dated-pms-buckets-tomorrow-20260916
