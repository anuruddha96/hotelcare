name: Housekeeping extension SQL CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/2026092014*'
      - 'supabase/migrations/2026092015*'
      - 'supabase/tests/stay_extension*'
      - '.github/workflows/housekeeping-extension-sql-ci.yml'

permissions:
  contents: read

jobs:
  extension-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotelcare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hotelcare_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Test migrations and extension workflows in a disposable database
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stay_extension_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260920143000_housekeeping_stay_extension_review.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260920143100_stay_extension_realtime_and_ordering.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260920150000_stop_false_service_completions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260920150100_conservative_extension_service_reviews.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/stay_extension_integration.sql
