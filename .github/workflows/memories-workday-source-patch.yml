name: One-time Memories workday source repair

on:
  push:
    branches:
      - fix/memories-workday-instructions-20260921
    paths:
      - .github/workflows/memories-workday-source-patch.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/memories-workday-instructions-20260921
          fetch-depth: 0
      - name: Apply assertions and patch source
        run: python3 .github/scripts/patch_memories_workday_source.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run full regression suite
        run: bun run test
      - name: Build production frontend
        run: bun run build
      - name: Remove one-time patch machinery and commit tested fix
        run: |
          rm .github/workflows/memories-workday-source-patch.yml
          rm .github/scripts/patch_memories_workday_source.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dashboard/HotelRoomOverviewLive.tsx src/lib/__tests__/memoriesWorkdayInstructions.test.ts .github/workflows/memories-workday-source-patch.yml .github/scripts/patch_memories_workday_source.py
          git commit -m 'fix(memories): prevent stale overview editors from erasing workday notes'
          git push origin HEAD:fix/memories-workday-instructions-20260921
