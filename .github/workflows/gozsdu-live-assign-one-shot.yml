name: Gozsdu one-shot live PMS Auto Assign integration
on:
  push:
    branches:
      - fix/gozsdu-pms-building-compatible-autoassign-20260916
    paths:
      - .github/workflows/gozsdu-live-assign-one-shot.yml
permissions:
  contents: write
jobs:
  integrate-verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-anchor integration, abort on concurrent drift
        run: python3 scripts/.temporary_gozsdu_live_assign_integration.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Gozsdu focused regression tests
        run: bunx vitest run src/lib/gozsduBuildingAssignment.test.ts src/lib/gozsduVerifiedAutoAssign.test.ts src/lib/gozsduLaundryAssignment.test.ts src/lib/roomAssignmentAlgorithm.gozsdu.test.ts src/lib/gozsduPmsRoster.test.ts
      - name: Commit verified integration and remove one-shot tools
        run: |
          git rm .github/workflows/gozsdu-live-assign-one-shot.yml scripts/.temporary_gozsdu_live_assign_integration.py
          git add src/components/dashboard/AutoRoomAssignmentImpl.tsx
          git -c user.name='HotelCare CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix(gozsdu): verify live Auto Assign against selected-date Previo and guard routing'
          git push origin HEAD:fix/gozsdu-pms-building-compatible-autoassign-20260916
