name: RD attendance cutoff and property CI
on:
  pull_request:
    paths:
      - 'docs/hr-attendance-rd-*.review.sql'
      - 'supabase/migrations/*_rd_attendance_protected_checkout.sql'
      - 'supabase/tests/hr_rd_attendance_*.sql'
      - '.github/workflows/hr-rd-attendance-ci.yml'
permissions:
  contents: read
jobs:
  rd-attendance-scratch:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hr_rd_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hr_rd_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Generate or verify exact versioned migration
        run: |
          set -euo pipefail
          supabase --version
          shopt -s nullglob
          files=(supabase/migrations/*_rd_attendance_protected_checkout.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            supabase migration new rd_attendance_protected_checkout
            files=(supabase/migrations/*_rd_attendance_protected_checkout.sql)
            test "${#files[@]}" -eq 1
            cat docs/hr-attendance-rd-backend.review.sql docs/hr-attendance-rd-scheduler.review.sql > "${files[0]}"
          else
            test "${#files[@]}" -eq 1
            cat docs/hr-attendance-rd-backend.review.sql docs/hr-attendance-rd-scheduler.review.sql | cmp - "${files[0]}"
          fi
          echo "GENERATED_MIGRATION_PATH=${files[0]}"
          echo "RD_MIGRATION=${files[0]}" >> "$GITHUB_ENV"
      - name: Apply exact combined SQL and test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/hr_rd_attendance_fixture.sql -f supabase/tests/hr_rd_attendance_cron_fixture.sql -f "$RD_MIGRATION" -f supabase/tests/hr_rd_attendance_test.sql -f supabase/tests/hr_rd_attendance_cron_test.sql
