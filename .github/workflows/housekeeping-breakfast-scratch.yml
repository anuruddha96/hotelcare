name: Breakfast housekeeping scratch database
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261126124500_housekeeping_breakfast_signals.sql'
      - 'supabase/migrations/20261126143000_housekeeping_breakfast_notifications.sql'
      - 'supabase/functions/breakfast-mark-served/**'
      - 'supabase/functions/send-push-notification/**'
      - 'supabase/tests/housekeeping_breakfast_signals_scratch.sql'
      - '.github/workflows/housekeeping-breakfast-scratch.yml'
permissions:
  contents: read
jobs:
  scratch-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migration, real role isolation checks and rollback on scratch PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -X -h localhost -U postgres -d scratch -v ON_ERROR_STOP=1 -f supabase/tests/housekeeping_breakfast_signals_scratch.sql
  edge-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test breakfast dispatch and signed-in staff authorization
        run: deno test supabase/functions/breakfast-mark-served/notifications_test.ts
      - name: Type-check breakfast and push Edge Functions
        run: deno check supabase/functions/breakfast-mark-served/index.ts supabase/functions/send-push-notification/index.ts
