name: Manual billing integration checks

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*manual_stripe_payments_szamlazz_invoices.sql"
      - "supabase/functions/_shared/manualBilling*.ts"
      - "supabase/functions/_shared/rdOneTimeBilling.ts"
      - "supabase/functions/_shared/rdOneTimeRetryPolicy.ts"
      - "src/lib/rdOneTimeRetryPolicy.test.ts"
      - "supabase/migrations/*rd_one_time_payment_collection.sql"
      - "src/lib/rdOneTimeBilling.test.ts"
      - "supabase/functions/billing-manage/index.ts"
      - "supabase/functions/billing-webhook/index.ts"
      - "supabase/functions/manual-billing-worker/**"
      - ".github/workflows/manual-billing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Configure Deno local npm module resolution
        run: echo '{"nodeModulesDir":"auto"}' > deno.json
      - name: Deno type check without payment requests
        run: |
          deno check supabase/functions/_shared/manualBillingPolicy.ts
          deno check supabase/functions/manual-billing-worker/index.ts
          deno check supabase/functions/billing-webhook/index.ts
          deno check supabase/functions/billing-manage/index.ts
          deno check supabase/functions/_shared/rdOneTimeBilling.ts
          deno check supabase/functions/_shared/rdOneTimeRetryPolicy.ts
      - name: Test RD one-time package amounts and eligibility
        run: bunx vitest run src/lib/rdOneTimeBilling.test.ts src/lib/rdOneTimeRetryPolicy.test.ts

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_USER: postgres
          POSTGRES_DB: hotelcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: hotelcare_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema, invoice uniqueness and atomic due claims
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.organizations(slug text PRIMARY KEY);
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261014113000_manual_stripe_payments_szamlazz_invoices.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.organizations(slug) VALUES ('testhotel');
          INSERT INTO public.manual_billing_contracts (
            id,organization_slug,status,selections,items,currency,net_cents,vat_cents,gross_cents,
            vat_percent_snapshot,stripe_customer_id,stripe_payment_method_id,next_charge_at
          ) VALUES ('11111111-1111-4111-8111-111111111111','testhotel','active',
            '["hotelA:revenue_automation"]'::jsonb,'[{"hotel_id":"hotelA","module":"revenue_automation","quantity":1,"unit_amount_cents":40000}]'::jsonb,
            'EUR',40000,10800,50800,27,'cus_test','pm_test',now()-interval '1 day');
          DO $$
          DECLARE first_count int; second_count int;
          BEGIN
            SELECT count(*) INTO first_count FROM public.manual_billing_claim_due(10);
            SELECT count(*) INTO second_count FROM public.manual_billing_claim_due(10);
            IF first_count <> 1 OR second_count <> 0 THEN
              RAISE EXCEPTION 'Expected exactly one due claim, got % then %',first_count,second_count;
            END IF;
          END
          $$;
          INSERT INTO public.manual_billing_scopes(hotel_id,module,contract_id)
            VALUES('hotelA','revenue_automation','11111111-1111-4111-8111-111111111111');
          DO $$
          BEGIN
            BEGIN
              INSERT INTO public.manual_billing_scopes(hotel_id,module,contract_id)
                VALUES('hotelA','revenue_automation','11111111-1111-4111-8111-111111111111');
              RAISE EXCEPTION 'Duplicate scope accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END
          $$;
          SQL

      - name: Validate one-time ledger and prohibit invoicing unpaid requests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261015123000_rd_one_time_payment_collection.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.organizations(slug) VALUES ('rdhotels');
          INSERT INTO public.billing_one_time_payments
            (id,organization_slug,package_key,description,net_cents,vat_cents,gross_cents)
          VALUES ('22222222-2222-4222-8222-222222222222','rdhotels','revenue','Test',40000,10800,50800);
          DO $$
          BEGIN
            BEGIN
              INSERT INTO public.billing_one_time_payments
                (organization_slug,package_key,description,net_cents,vat_cents,gross_cents)
              VALUES ('rdhotels','revenue','Duplicate',40000,10800,50800);
              RAISE EXCEPTION 'Duplicate pending Checkout accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
            BEGIN
              UPDATE public.billing_one_time_payments SET szamlazz_invoice_number='INV-TEST'
              WHERE id='22222222-2222-4222-8222-222222222222';
              RAISE EXCEPTION 'Pending payment was invoiced';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END
          $$;
          UPDATE public.billing_one_time_payments SET status='paid', paid_at=now(),
            szamlazz_invoice_number='INV-TEST' WHERE id='22222222-2222-4222-8222-222222222222';
          SQL
