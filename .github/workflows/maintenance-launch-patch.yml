'''
          replace_once(staff, "const HOLD_REASONS = [\n", extra + "const HOLD_REASONS = [\n")
          replace_once(staff, "  const c = translations[language] || EN;\n", "  const c = { ...(translations[language] || EN), ...(EXTRA_TRANSLATIONS[language] || {}) };\n")

          Path('.github/workflows/maintenance-launch-patch.yml').unlink()
          PY
          git config user.name "hotelcare-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finish maintenance launch readiness"
          git push origin HEAD:fix/maintenance-supervisor-forwarded-i18n
