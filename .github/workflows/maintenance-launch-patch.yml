name: Maintenance Launch Patch

on:
  push:
    branches:
      - fix/maintenance-supervisor-forwarded-i18n

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maintenance-supervisor-forwarded-i18n
          fetch-depth: 0
      - name: Apply deterministic maintenance patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\n--- target ---\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))

          supervisor = 'src/components/dashboard/SupervisorApprovalView.tsx'
          replace_once(supervisor, "import { getSignedPhotoUrls } from '@/lib/storageUrls';\n", "import { getSignedPhotoUrls } from '@/lib/storageUrls';\nimport { resolveHotelKeys } from '@/lib/hotelKeys';\n")
          replace_once(supervisor, "import { LateMinibarApprovals } from './LateMinibarApprovals';\n", "import { LateMinibarApprovals } from './LateMinibarApprovals';\nimport { ForwardedMaintenanceApprovals } from './ForwardedMaintenanceApprovals';\n")
          replace_once(
              supervisor,
              """        }\n      )\n      .subscribe();\n\n    return () => {\n      supabase.removeChannel(channel);\n    };\n  }, [selectedDate, showNotification, t]);\n""",
              """        }\n      )\n      .on(\n        'postgres_changes',\n        { event: '*', schema: 'public', table: 'tickets' },\n        (payload: any) => {\n          const row = payload.new || payload.old;\n          if (row?.department === 'maintenance') fetchPendingMaintenanceTickets();\n        }\n      )\n      .subscribe();\n\n    return () => {\n      supabase.removeChannel(channel);\n    };\n  }, [selectedDate, showNotification, t]);\n""",
          )
          replace_once(
              supervisor,
              """      const { data: maintStaff, error: maintError } = await supabase.rpc('get_assignable_staff', {\n        hotel_filter: profile?.assigned_hotel\n      });\n\n      if (!maintError) {\n        const maintenanceOnly = (maintStaff || []).filter((s: any) => s.role === 'maintenance');\n        setMaintenanceStaff(maintenanceOnly);\n      }\n""",
              """      const { data: maintStaff, error: maintError } = await (supabase as any).rpc('get_maintenance_staff_for_hotel', {\n        _hotel: profile?.assigned_hotel || null,\n        _signed_in_only: false,\n      });\n\n      if (!maintError) {\n        setMaintenanceStaff((maintStaff || []).map((s: any) => ({ id: s.id, full_name: s.full_name, role: s.role })));\n      }\n""",
          )
          replace_once(supervisor, """      if (!profile?.organization_slug) return;\n\n      let query = supabase\n""", """      if (!profile?.organization_slug) return;\n      const hotelKeys = await resolveHotelKeys(profile.assigned_hotel);\n\n      let query = supabase\n""")
          replace_once(supervisor, """      if (profile.assigned_hotel) {\n        query = query.eq('hotel', profile.assigned_hotel);\n      }\n""", """      if (hotelKeys.length) {\n        query = query.in('hotel', hotelKeys);\n      }\n""")
          replace_once(
              supervisor,
              """        })\n        .eq('id', ticketId);\n\n      if (error) throw error;\n\n      toast.success('Maintenance ticket approved');\n""",
              """        })\n        .eq('id', ticketId)\n        .eq('department', 'maintenance')\n        .eq('pending_supervisor_approval', true);\n\n      if (error) throw error;\n\n      toast.success('Maintenance ticket approved');\n""",
          )
          replace_once(
              supervisor,
              """        })\n        .eq('id', ticketId);\n\n      if (error) throw error;\n\n      toast.success('Ticket reassigned successfully');\n""",
              """        })\n        .eq('id', ticketId)\n        .eq('department', 'maintenance');\n\n      if (error) throw error;\n\n      toast.success('Ticket reassigned successfully');\n""",
          )
          replace_once(
              supervisor,
              """        <TabsContent value=\"pending\" className=\"space-y-6\">\n          <div id=\"pending-approvals-list\" />\n          {/* Date picker */}\n""",
              """        <TabsContent value=\"pending\" className=\"space-y-6\">\n          <div id=\"pending-approvals-list\" />\n          <ForwardedMaintenanceApprovals />\n          {/* Date picker */}\n""",
          )

          banner = 'src/components/dashboard/NotificationPermissionBanner.tsx'
          replace_once(banner, "import { useState } from 'react';\n", "import { useEffect, useState } from 'react';\n")
          replace_once(banner, "import { useAuth } from '@/hooks/useAuth';\n", "import { useAuth } from '@/hooks/useAuth';\nimport { supabase } from '@/integrations/supabase/client';\nimport { resolveHotelKeys } from '@/lib/hotelKeys';\n")
          replace_once(banner, "const { requestNotificationPermission, notificationPermission, ensureAudioUnlocked, playNotificationSound } = useNotifications();", "const { requestNotificationPermission, notificationPermission, ensureAudioUnlocked, playNotificationSound, showNotification } = useNotifications();")
          replace_once(banner, "  const { t } = useTranslation();\n  const { user } = useAuth();\n", "  const { t, language } = useTranslation();\n  const { user, profile } = useAuth();\n")
          marker = "  const [dontShowAgain, setDontShowAgain] = useState(false);\n"
          notifications = r'''

  useEffect(() => {
    if (!user?.id || !profile?.organization_slug || !profile?.assigned_hotel) return;
    let disposed = false;
    let channel: ReturnType<typeof supabase.channel> | null = null;

    const copy: Record<string, { title: string; assigned: string; forwarded: string; approval: string; approved: string; room: string }> = {
      en: { title: 'Maintenance', assigned: 'New maintenance task assigned', forwarded: 'New maintenance request forwarded', approval: 'Repair submitted for supervisor approval', approved: 'Your maintenance repair was approved', room: 'Room' },
      hu: { title: 'Karbantartás', assigned: 'Új karbantartási feladat érkezett', forwarded: 'Új karbantartási kérés továbbítva', approval: 'A javítás felügyelői jóváhagyásra vár', approved: 'A karbantartási javítást jóváhagyták', room: 'Szoba' },
      es: { title: 'Mantenimiento', assigned: 'Nueva tarea de mantenimiento asignada', forwarded: 'Nueva solicitud de mantenimiento reenviada', approval: 'Reparación enviada para aprobación del supervisor', approved: 'Su reparación de mantenimiento fue aprobada', room: 'Habitación' },
      vi: { title: 'Bảo trì', assigned: 'Đã giao công việc bảo trì mới', forwarded: 'Đã chuyển yêu cầu bảo trì mới', approval: 'Công việc sửa chữa đã gửi để giám sát duyệt', approved: 'Công việc sửa chữa của bạn đã được duyệt', room: 'Phòng' },
      mn: { title: 'Засвар үйлчилгээ', assigned: 'Шинэ засварын ажил хуваарилагдлаа', forwarded: 'Шинэ засварын хүсэлт шилжүүлэгдлээ', approval: 'Засварыг хянагчийн зөвшөөрөлд илгээлээ', approved: 'Таны засварын ажил зөвшөөрөгдлөө', room: 'Өрөө' },
      az: { title: 'Texniki xidmət', assigned: 'Yeni texniki xidmət tapşırığı təyin edildi', forwarded: 'Yeni texniki xidmət sorğusu yönləndirildi', approval: 'Təmir nəzarətçi təsdiqinə göndərildi', approved: 'Texniki xidmət təmiriniz təsdiqləndi', room: 'Otaq' },
      tl: { title: 'Maintenance', assigned: 'May bagong maintenance task na naka-assign', forwarded: 'May bagong maintenance request na na-forward', approval: 'Ipinadala ang repair para sa supervisor approval', approved: 'Na-approve ang maintenance repair mo', room: 'Kuwarto' },
      uk: { title: 'Техобслуговування', assigned: 'Вам призначено нове завдання з ремонту', forwarded: 'Передано нову заявку на ремонт', approval: 'Ремонт надіслано на схвалення керівника', approved: 'Ваш ремонт схвалено', room: 'Кімната' },
      ru: { title: 'Техобслуживание', assigned: 'Вам назначена новая задача по ремонту', forwarded: 'Передана новая заявка на ремонт', approval: 'Ремонт отправлен на одобрение руководителя', approved: 'Ваш ремонт одобрен', room: 'Комната' },
    };

    const setup = async () => {
      const keys = await resolveHotelKeys(profile.assigned_hotel);
      const hotelKeys = keys.length ? keys : [profile.assigned_hotel];
      if (disposed) return;
      const c = copy[language] || copy.en;
      const supervisorRoles = new Set(['manager', 'housekeeping_manager', 'maintenance_manager', 'supervisor', 'admin']);

      channel = supabase
        .channel(`maintenance-notifications-${user.id}-${profile.assigned_hotel}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tickets' }, (payload: any) => {
          const row = payload.new || payload.old;
          const old = payload.old || {};
          if (!row || row.department !== 'maintenance') return;
          if (row.organization_slug !== profile.organization_slug) return;
          if (row.source === 'housekeeping_legacy_backfill') return;
          if (row.hotel && !hotelKeys.includes(row.hotel)) return;

          const suffix = row.room_number ? ` · ${c.room} ${row.room_number}` : '';
          const newlyAssignedToMe = row.assigned_to === user.id && (payload.eventType === 'INSERT' || old.assigned_to !== user.id);
          if (newlyAssignedToMe) {
            void showNotification(`${c.assigned}${suffix}`, 'info', c.title);
            return;
          }
          if (row.assigned_to === user.id && payload.eventType === 'UPDATE' && old.supervisor_approved !== true && row.supervisor_approved === true) {
            void showNotification(`${c.approved}${suffix}`, 'success', c.title);
            return;
          }
          if (!supervisorRoles.has(profile.role || '')) return;
          if (payload.eventType === 'INSERT' && row.created_by !== user.id) {
            void showNotification(`${c.forwarded}${suffix}`, row.priority === 'urgent' ? 'warning' : 'info', c.title);
          } else if (payload.eventType === 'UPDATE' && old.pending_supervisor_approval !== true && row.pending_supervisor_approval === true) {
            void showNotification(`${c.approval}${suffix}`, 'warning', c.title);
          }
        })
        .subscribe();
    };

    void setup();
    return () => {
      disposed = true;
      if (channel) supabase.removeChannel(channel);
    };
  }, [user?.id, profile?.organization_slug, profile?.assigned_hotel, profile?.role, language, showNotification]);
'''
          replace_once(banner, marker, marker + notifications)

          staff = 'src/components/dashboard/MaintenanceStaffView.tsx'
          extra = r'''
const EXTRA_TRANSLATIONS: Record<string, Partial<Copy>> = {
  es: { room: 'Habitación', hotel: 'Hotel', statusOpen: 'Abierto', statusProgress: 'En curso', statusHold: 'Pendiente', statusApproval: 'Esperando aprobación', statusDone: 'Hecho', parts: 'Esperando piezas', purchase: 'Compra en curso', access: 'Esperando acceso a la habitación', approvalReason: 'Esperando aprobación', contractor: 'Se necesita contratista externo', other: 'Otro', cancel: 'Cancelar', notePlaceholder: 'Escriba una actualización para el supervisor…', resolutionPlaceholder: 'Describa la reparación y el trabajo realizado…', photoRequired: 'Añada una foto final antes de enviar.', workStarted: 'Trabajo iniciado', holdSaved: 'Ticket marcado como pendiente', resumed: 'Trabajo reanudado', noteSaved: 'Nota añadida', submitted: 'Enviado para aprobación del supervisor', failed: 'La acción falló' },
  vi: { room: 'Phòng', hotel: 'Khách sạn', statusOpen: 'Mở', statusProgress: 'Đang xử lý', statusHold: 'Đang chờ', statusApproval: 'Chờ duyệt', statusDone: 'Hoàn tất', parts: 'Đang chờ linh kiện', purchase: 'Đang mua hàng', access: 'Đang chờ vào phòng', approvalReason: 'Đang chờ phê duyệt', contractor: 'Cần nhà thầu bên ngoài', other: 'Khác', cancel: 'Hủy', notePlaceholder: 'Viết cập nhật cho giám sát…', resolutionPlaceholder: 'Mô tả việc sửa chữa đã thực hiện…', photoRequired: 'Thêm một ảnh hoàn tất trước khi gửi.', workStarted: 'Đã bắt đầu công việc', holdSaved: 'Phiếu đã chuyển sang chờ', resumed: 'Đã tiếp tục công việc', noteSaved: 'Đã thêm ghi chú', submitted: 'Đã gửi để giám sát duyệt', failed: 'Thao tác thất bại' },
  mn: { room: 'Өрөө', hotel: 'Зочид буудал', statusOpen: 'Нээлттэй', statusProgress: 'Явагдаж байна', statusHold: 'Хүлээгдэж байна', statusApproval: 'Зөвшөөрөл хүлээж байна', statusDone: 'Дууссан', parts: 'Сэлбэг хүлээж байна', purchase: 'Худалдан авалт явагдаж байна', access: 'Өрөөнд нэвтрэхийг хүлээж байна', approvalReason: 'Зөвшөөрөл хүлээж байна', contractor: 'Гадны гүйцэтгэгч шаардлагатай', other: 'Бусад', pendingDetails: 'Засварыг юу саатуулж байгааг хянагчид тайлбарлана уу.', cancel: 'Цуцлах', notePlaceholder: 'Хянагчид зориулж шинэчлэлт бичнэ үү…', resolutionPlaceholder: 'Засвар болон хийсэн ажлыг тайлбарлана уу…', photoRequired: 'Илгээхийн өмнө нэг дууссан ажлын зураг нэмнэ үү.', workStarted: 'Ажил эхэлсэн', holdSaved: 'Тасалбар хүлээгдэж байна', resumed: 'Ажил үргэлжилсэн', noteSaved: 'Тэмдэглэл нэмэгдсэн', submitted: 'Хянагчийн зөвшөөрөлд илгээгдсэн', failed: 'Үйлдэл амжилтгүй' },
  az: { room: 'Otaq', hotel: 'Otel', statusOpen: 'Açıq', statusProgress: 'İcradadır', statusHold: 'Gözləmədə', statusApproval: 'Təsdiq gözləyir', statusDone: 'Tamamlandı', parts: 'Ehtiyat hissələri gözlənilir', purchase: 'Satınalma davam edir', access: 'Otağa giriş gözlənilir', approvalReason: 'Təsdiq gözlənilir', contractor: 'Xarici podratçı lazımdır', other: 'Digər', pendingDetails: 'Təmirə nə mane olduğunu nəzarətçi üçün qeyd edin.', cancel: 'Ləğv et', notePlaceholder: 'Nəzarətçi üçün yeniləmə yazın…', resolutionPlaceholder: 'Təmiri və görülən işi təsvir edin…', photoRequired: 'Göndərməzdən əvvəl bir tamamlanma şəkli əlavə edin.', workStarted: 'İş başladı', holdSaved: 'Tapşırıq gözləməyə alındı', resumed: 'İş davam etdirildi', noteSaved: 'Qeyd əlavə edildi', submitted: 'Nəzarətçi təsdiqinə göndərildi', failed: 'Əməliyyat uğursuz oldu' },
  tl: { room: 'Kuwarto', hotel: 'Hotel', statusOpen: 'Bukas', statusProgress: 'Ginagawa', statusHold: 'Pending', statusApproval: 'Naghihintay ng approval', statusDone: 'Tapos', parts: 'Naghihintay ng parts', purchase: 'May kasalukuyang pagbili', access: 'Naghihintay ng access sa kuwarto', approvalReason: 'Naghihintay ng approval', contractor: 'Kailangan ng external contractor', other: 'Iba pa', pendingDetails: 'Magdagdag ng detalye para malaman ng supervisor kung ano ang humahadlang sa repair.', cancel: 'Kanselahin', notePlaceholder: 'Sumulat ng update para sa supervisor…', resolutionPlaceholder: 'Ilarawan ang repair at ginawa…', photoRequired: 'Magdagdag ng isang completion photo bago isumite.', workStarted: 'Sinimulan ang trabaho', holdSaved: 'Minarkahang pending ang ticket', resumed: 'Ipinagpatuloy ang trabaho', noteSaved: 'Nagdagdag ng note', submitted: 'Isinumite para sa supervisor approval', failed: 'Nabigo ang aksyon' },
  uk: { room: 'Кімната', hotel: 'Готель', statusOpen: 'Відкрита', statusProgress: 'У роботі', statusHold: 'Очікує', statusApproval: 'Очікує схвалення', statusDone: 'Готово', parts: 'Очікування запчастин', purchase: 'Закупівля триває', access: 'Очікування доступу до кімнати', approvalReason: 'Очікування схвалення', contractor: 'Потрібен зовнішній підрядник', other: 'Інше', pendingDetails: 'Додайте деталі, щоб керівник знав, що блокує ремонт.', cancel: 'Скасувати', notePlaceholder: 'Напишіть оновлення для керівника…', resolutionPlaceholder: 'Опишіть ремонт і виконані роботи…', photoRequired: 'Додайте одне фото завершення перед надсиланням.', workStarted: 'Роботу розпочато', holdSaved: 'Заявку переведено в очікування', resumed: 'Роботу продовжено', noteSaved: 'Нотатку додано', submitted: 'Надіслано на схвалення керівника', failed: 'Дія не вдалася' },
  ru: { room: 'Комната', hotel: 'Отель', statusOpen: 'Открыта', statusProgress: 'В работе', statusHold: 'Ожидает', statusApproval: 'Ожидает одобрения', statusDone: 'Готово', parts: 'Ожидание запчастей', purchase: 'Закупка в процессе', access: 'Ожидание доступа в комнату', approvalReason: 'Ожидание одобрения', contractor: 'Нужен внешний подрядчик', other: 'Другое', pendingDetails: 'Добавьте детали, чтобы руководитель видел, что блокирует ремонт.', cancel: 'Отмена', notePlaceholder: 'Напишите обновление для руководителя…', resolutionPlaceholder: 'Опишите ремонт и выполненные работы…', photoRequired: 'Добавьте одно фото завершения перед отправкой.', workStarted: 'Работа начата', holdSaved: 'Заявка переведена в ожидание', resumed: 'Работа продолжена', noteSaved: 'Заметка добавлена', submitted: 'Отправлено на одобрение руководителя', failed: 'Действие не выполнено' },
