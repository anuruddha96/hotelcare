name: Repair stale revenue tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-stale-revenue-tests.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Add one-time stale revenue test repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align stale tests with current policies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('src/lib/__tests__/engineV2.test.ts')
          engine = engine_path.read_text()
          old_engine = '''  it("0–2 days: every booking raises, and a strong date raises more", () => {
            expect(decideDate(input({ daysOut: 1, occupancyPct: 70, pickup24h: 1 }), settings()).direction).toBe("increase");
            const two = decideDate(input({ daysOut: 1, occupancyPct: 70, pickup24h: 2 }), settings()).movement;
            const one = decideDate(input({ daysOut: 1, occupancyPct: 70, pickup24h: 1 }), settings()).movement;
            expect(two).toBeGreaterThan(one);
            expect(decideDate(input({ daysOut: 1, occupancyPct: 92, roomsRemaining: 2, pickup24h: 1 }), settings()).movement)
              .toBeGreaterThanOrEqual(one);
          });

          it("0–2 days: no booking for six hours marks down by occupancy band", () => {
            const base = { daysOut: 1, hoursSinceLastPickup: 8 } as Partial<DecisionInput>;
            expect(decideDate(input({ ...base, occupancyPct: 40 }), settings()).movement).toBe(-5);
            expect(decideDate(input({ ...base, occupancyPct: 65 }), settings()).movement).toBe(-3);
            expect(decideDate(input({ ...base, occupancyPct: 85, roomsRemaining: 3 }), settings()).blocked).toBe(true);
          });

          it("0–2 days: the wait must actually elapse", () => {
            const d = decideDate(input({ daysOut: 1, occupancyPct: 40, hoursSinceLastPickup: 2 }), settings());
            expect(d.reason).toBe("awaiting_no_pickup_window");
          });'''
          new_engine = '''  it("0–2 days: tomorrow/day+2 prioritise sell-out while inventory remains", () => {
            const noPickup = decideDate(input({ daysOut: 1, occupancyPct: 70, pickup24h: 0 }), settings());
            const onePickup = decideDate(input({ daysOut: 1, occupancyPct: 70, pickup24h: 1 }), settings());
            const strong = decideDate(input({ daysOut: 1, occupancyPct: 92, roomsRemaining: 2, pickup24h: 1 }), settings());
            expect(noPickup.direction).toBe("decrease");
            expect(noPickup.movement).toBe(-4);
            expect(onePickup.direction).toBe("decrease");
            expect(onePickup.movement).toBe(-3);
            expect(onePickup.movement).toBeGreaterThan(noPickup.movement);
            expect(strong.movement).toBe(-3);
          });

          it("0–2 days: tomorrow uses urgency and demand to size the final sell-out cut", () => {
            const base = { daysOut: 1, hoursSinceLastPickup: 8 } as Partial<DecisionInput>;
            expect(decideDate(input({ ...base, occupancyPct: 40 }), settings()).movement).toBe(-4);
            expect(decideDate(input({ ...base, occupancyPct: 65 }), settings()).movement).toBe(-4);
            expect(decideDate(input({ ...base, occupancyPct: 85, roomsRemaining: 3 }), settings()).movement).toBe(-3);
          });

          it("0–2 days: tomorrow/day+2 no longer wait for the old no-pickup window", () => {
            const d = decideDate(input({ daysOut: 1, occupancyPct: 40, hoursSinceLastPickup: 2 }), settings());
            expect(d.reason).toBe("final_3_day_fill");
            expect(d.movement).toBe(-4);
          });'''
          if old_engine not in engine:
              raise SystemExit('Expected Engine V2 stale-test block was not found; refusing to patch.')
          engine_path.write_text(engine.replace(old_engine, new_engine, 1))

          resume_path = Path('src/hooks/__tests__/useRevenueHotelData.resume.test.tsx')
          resume = resume_path.read_text()
          old_render = 'renderHook(() => useRevenueHotelData("hotel-1", "org-1"))'
          hotel_ids = [
              'hotel-resume-read',
              'hotel-resume-selection',
              'hotel-resume-editor',
              'hotel-resume-failure',
          ]
          for hotel_id in hotel_ids:
              if old_render not in resume:
                  raise SystemExit('Expected revenue-resume renderHook occurrence was not found; refusing to patch.')
              resume = resume.replace(
                  old_render,
                  f'renderHook(() => useRevenueHotelData("{hotel_id}", "org-1"))',
                  1,
              )

          loading_wait = '    await waitFor(() => expect(result.current.loading).toBe(false));\n'
          if resume.count(loading_wait) != 4:
              raise SystemExit(f'Expected four loading waits, found {resume.count(loading_wait)}; refusing to patch.')
          resume = resume.replace(
              loading_wait,
              loading_wait + '    await waitFor(() => expect(result.current.extending).toBe(false));\n',
          )

          old_rpc_expect = '''    expect(last[0]).toBe("get_revenue_published_payload");
            expect(last[1]).toEqual({ _hotel_id: "hotel-1" });'''
          new_rpc_expect = '''    expect(last[0]).toBe("get_revenue_published_payload_window");
            expect(last[1]).toEqual({ _hotel_id: "hotel-resume-selection", _horizon_days: 365 });'''
          if old_rpc_expect not in resume:
              raise SystemExit('Expected stale payload RPC expectation was not found; refusing to patch.')
          resume = resume.replace(old_rpc_expect, new_rpc_expect, 1)

          old_failure = '''    rpc.mockResolvedValue({ data: null, error: { message: "offline" } });
            await act(async () => { fireResume(); });
            await waitFor(() => expect(rpc.mock.calls.length).toBeGreaterThan(1));'''
          new_failure = '''    const initial = rpc.mock.calls.length;
            rpc.mockResolvedValue({ data: null, error: { message: "offline" } });
            await act(async () => { fireResume(); });
            await waitFor(() => expect(rpc.mock.calls.length).toBeGreaterThan(initial));'''
          if old_failure not in resume:
              raise SystemExit('Expected stale refresh-failure assertion was not found; refusing to patch.')
          resume_path.write_text(resume.replace(old_failure, new_failure, 1))
          PY

      - name: Run repaired tests
        run: bunx vitest run src/lib/__tests__/engineV2.test.ts src/hooks/__tests__/useRevenueHotelData.resume.test.tsx

      - name: Commit repaired tests
        run: |
          git config user.name "hotelcare-ci"
          git config user.email "hotelcare-ci@users.noreply.github.com"
          git add src/lib/__tests__/engineV2.test.ts src/hooks/__tests__/useRevenueHotelData.resume.test.tsx
          git diff --cached --check
          git commit -m "Align revenue tests with current policies"
          git push origin HEAD:main
