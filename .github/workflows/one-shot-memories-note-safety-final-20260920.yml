name: One-shot Memories note safety final
on:
  push:
    branches: [fix/memories-instruction-loss-note-concurrency-20260920]
    paths: ['.github/workflows/one-shot-memories-note-safety-final-20260920.yml']
permissions:
  contents: write
jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply validated exact replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/one-shot-memories-note-safety-20260920.yml')
          content = path.read_text()
          start = content.index('          from pathlib import Path\n')
          end = content.index('\n          PY\n', start)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in content[start:end].splitlines())
          exec(compile(code, str(path), 'exec'))
          PY
      - name: Resolve lock drift and missing test peer without editing manifest
        run: |
          npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund @testing-library/dom@10.4.2
      - name: Complete test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Remove temporary workflows and commit verified repair
        run: |
          rm .github/workflows/one-shot-memories-note-safety-20260920.yml .github/workflows/one-shot-memories-note-safety-retry-20260920.yml .github/workflows/one-shot-memories-note-safety-final-20260920.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/dashboard/RoomDetailDialog.tsx src/components/dashboard/RoomOperationsQuickHub.tsx src/lib/__tests__/memoriesNoteLossSafety.test.ts .github/workflows/one-shot-memories-note-safety-20260920.yml .github/workflows/one-shot-memories-note-safety-retry-20260920.yml .github/workflows/one-shot-memories-note-safety-final-20260920.yml
          git commit -m 'Prevent stale note autosave, status and QuickHub writes'
          git push origin HEAD:fix/memories-instruction-loss-note-concurrency-20260920
