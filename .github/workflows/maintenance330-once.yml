name: Maintenance issue 330 one-shot patch and verification
on:
  push:
    branches: [fix/global-maintenance-issues-330]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: contains(github.event.head_commit.message, 'trigger maintenance 330 one-shot')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-maintenance-issues-330
          persist-credentials: true
      - name: Apply exact-anchor patch; reject changed or missing anchors
        run: python3 scripts/maintenance330_once.py
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run entire frontend test suite
        run: bun run test
      - name: Build production bundle
        run: bun run build
      - name: Commit only verified application changes; delete one-shot tools
        run: |
          git rm scripts/maintenance330_once.py .github/workflows/maintenance330-once.yml
          git add src/components/dashboard src/lib/maintenanceIssueMetrics.ts src/lib/__tests__/maintenanceIssueMetrics.test.ts
          git config user.name 'HotelCare CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(maintenance): synchronize completed issues and photo evidence, improve reporting (#330)'
          git push origin HEAD:fix/global-maintenance-issues-330
