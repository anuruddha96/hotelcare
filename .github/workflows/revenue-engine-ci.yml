name: Revenue engine CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/engineV2*'
      - 'supabase/functions/revenue-pickup-automation/runV2.ts'
      - 'supabase/functions/_shared/adrGuard.ts'
      - 'supabase/functions/_shared/sameDaySellout.ts'
      - 'supabase/functions/_shared/ottofioriAiSupervisor*'
      - 'supabase/functions/_shared/ottofioriMarketDates*'
      - 'supabase/functions/ottofiori-ai-supervisor/**'
      - 'supabase/functions/ottofiori-market-scan/**'
      - '.github/workflows/revenue-engine-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/engineV2*'
      - 'supabase/functions/revenue-pickup-automation/runV2.ts'
      - 'supabase/functions/_shared/adrGuard.ts'
      - 'supabase/functions/_shared/sameDaySellout.ts'
      - 'supabase/functions/_shared/ottofioriAiSupervisor*'
      - 'supabase/functions/_shared/ottofioriMarketDates*'
      - 'supabase/functions/ottofiori-ai-supervisor/**'
      - 'supabase/functions/ottofiori-market-scan/**'
      - '.github/workflows/revenue-engine-ci.yml'

permissions:
  contents: read

jobs:
  revenue-engine-v2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Revenue Engine V2 regression tests
        run: deno test supabase/functions/_shared/engineV2*_test.ts
      - name: Type-check Ottofiori AI supervisor
        run: deno check --node-modules-dir=none supabase/functions/ottofiori-ai-supervisor/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify revenue director and publication budgets
        run: node --test supabase/functions/_shared/engineV2*.test.mjs supabase/functions/_shared/ottofioriAiSupervisor.test.mjs supabase/functions/_shared/ottofioriMarketDates.test.mjs
