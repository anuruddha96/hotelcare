name: Revenue engine CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/engineV2*.ts'
      - 'supabase/functions/_shared/adrGuard.ts'
      - 'supabase/functions/_shared/sameDaySellout.ts'
      - '.github/workflows/revenue-engine-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/_shared/engineV2*.ts'
      - 'supabase/functions/_shared/adrGuard.ts'
      - 'supabase/functions/_shared/sameDaySellout.ts'
      - '.github/workflows/revenue-engine-ci.yml'

permissions:
  contents: read

jobs:
  revenue-engine-v2-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Revenue Engine V2 regression tests
        run: deno test supabase/functions/_shared/engineV2*_test.ts
