name: Apply Housekeeping Phase 2 Patch

on:
  push:
    branches:
      - feature/housekeeping-schedule-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/housekeeping-schedule-v2
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: node scripts/apply-housekeeping-schedule-phase2.mjs

      - name: Remove one-time patch tooling
        run: |
          rm scripts/apply-housekeeping-schedule-phase2.mjs
          rm .github/workflows/phase2-housekeeping-patch.yml

      - name: Commit patched Auto Assign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/AutoRoomAssignmentImpl.tsx scripts/apply-housekeeping-schedule-phase2.mjs .github/workflows/phase2-housekeeping-patch.yml
          git diff --cached --check
          git commit -m "feat(housekeeping): connect Auto Assign to published roster"
          git push origin HEAD:feature/housekeeping-schedule-v2
