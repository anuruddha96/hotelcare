name: Apply desktop housekeeping notes fix v2

on:
  push:
    branches:
      - fix/desktop-housekeeping-notes-save-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/desktop-housekeeping-notes-save-v2

      - name: Apply focused source patch
        run: python3 scripts/apply-desktop-notes-fix.py

      - name: Check patch formatting
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production build
        run: bun run build

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/HotelRoomOverview.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix desktop housekeeping notes saving"
          git push origin HEAD:fix/desktop-housekeeping-notes-save-v2
