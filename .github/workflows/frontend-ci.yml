name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-mika-towel-only:
    name: Apply Mika towel-only patch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 .github/scripts/apply_mika_towel_only.py
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name 'hotelcare-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/dashboard/AssignedRoomCard.tsx src/components/dashboard/SupervisorApprovalView.tsx supabase/functions/previo-update-room-status/index.ts
          git commit -m 'feat: wire Mika towel-change-only housekeeping flow'
          git push origin HEAD:main

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production app
        run: bun run build

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test