name: One-off sold-out guest icon UI

on:
  push:
    branches:
      - ui/soldout-guest-icon-20260929

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace guest abbreviation with icon
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/revenue/RateStrategyGrid.tsx')
          text = path.read_text()

          old_import = 'import { Loader2, CalendarRange, ChevronDown, Info, AlertTriangle, Send, History, SlidersHorizontal, Maximize2, Minimize2, ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X } from "lucide-react";'
          new_import = 'import { Loader2, CalendarRange, ChevronDown, Info, AlertTriangle, Send, History, SlidersHorizontal, Maximize2, Minimize2, ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UsersRound } from "lucide-react";'
          if old_import not in text:
              raise SystemExit('lucide import not found')
          text = text.replace(old_import, new_import, 1)

          old = '<span className="font-semibold opacity-80" style={{ fontSize: fz(9) }}>{priceLabel(closedAt)}{soldOcc != null ? ` · ${soldOcc}g` : ""}</span>'
          new = '''<span className="font-semibold opacity-80 inline-flex items-center gap-0.5" style={{ fontSize: fz(9) }}>
                                  {priceLabel(closedAt)}
                                  {soldOcc != null && (
                                    <>
                                      <span className="opacity-60">·</span>
                                      <UsersRound className="h-2.5 w-2.5 shrink-0" aria-hidden="true" />
                                      <span>{soldOcc}</span>
                                    </>
                                  )}
                                </span>'''
          if old not in text:
              raise SystemExit('sold-out guest label not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/oneoff-soldout-guest-icon.yml').unlink()
          PY
      - name: Commit UI polish and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-soldout-guest-icon.yml
          git commit -m "ui: use guest icon in sold-out cells"
          git push
