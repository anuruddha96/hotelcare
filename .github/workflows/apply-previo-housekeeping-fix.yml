name: Apply Previo housekeeping fix

on:
  push:
    branches: [fix/previo-housekeeping-notes-bed-config]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/previo-housekeeping-notes-bed-config

      - name: Apply targeted source patch
        run: node .github/scripts/apply-previo-housekeeping-fix.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run note and bed regression tests
        run: bunx vitest run src/lib/previoHousekeepingNote.test.ts src/lib/bedConfigInference.test.ts

      - name: Build production app
        run: bun run build

      - name: Remove one-shot patch infrastructure
        run: |
          rm .github/scripts/apply-previo-housekeeping-fix.mjs
          rm .github/workflows/apply-previo-housekeeping-fix.yml

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pmsRefresh.ts \
                  src/lib/bedConfigInference.ts \
                  src/lib/bedConfigInference.test.ts \
                  src/components/dashboard/HotelRoomOverview.tsx \
                  .github/scripts/apply-previo-housekeeping-fix.mjs \
                  .github/workflows/apply-previo-housekeeping-fix.yml
          git commit -m "Fix Previo housekeeping notes and bed configuration"
          git push origin HEAD:fix/previo-housekeeping-notes-bed-config
