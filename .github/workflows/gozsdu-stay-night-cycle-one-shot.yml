name: One-shot Gozsdu stay-night service cycle correction
on:
  push:
    branches: [fix/gozsdu-stay-night-service-cycle-20260917]
permissions:
  contents: write
jobs:
  verify-and-commit:
    name: Patch, verify, commit and remove temporary tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply anchored Gozsdu-only correction
        run: python3 .github/one-shot/gozsdu-stay-night-cycle-patch.py
      - name: Verify scope, avoid old labels, and inspect related callers
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          actual=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected={'src/lib/gozsdu-housekeeping.ts','src/lib/gozsdu-housekeeping.test.ts','src/lib/gozsduPmsRoster.test.ts','src/components/dashboard/GozsduCourtRoomOverview.tsx'}
          assert actual==expected, f'Unexpected source mutations: {actual ^ expected}'
          source=Path('src/lib/gozsdu-housekeeping.ts').read_text()
          overview=Path('src/components/dashboard/GozsduCourtRoomOverview.tsx').read_text()
          assert 'currentNight < 3' in source and '(currentNight - 1) % 4' in source
          assert 'Complete Textile Change' in source and 'Complete Textile Change' in overview
          assert 'const stored = room.pms_metadata?.gozsduHousekeeping?.serviceType' not in overview
          assert "'Second-day service rooms'" in overview
          print('Confirmed changes confined to Gozsdu cycle, Gozsdu UI and their tests.')
          PY
          git grep -n -E 'getGozsduHousekeepingCycle|gozsduServiceLabel|Change Room' -- src | head -70 || true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused PMS night regression tests
        run: bun run test src/lib/gozsdu-housekeeping.test.ts src/lib/gozsduPmsRoster.test.ts
      - name: Full frontend regression suite
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Commit verified code only and delete temporary patch tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/one-shot/gozsdu-stay-night-cycle-patch.py .github/workflows/gozsdu-stay-night-cycle-one-shot.yml
          git add -- src/lib/gozsdu-housekeeping.ts src/lib/gozsdu-housekeeping.test.ts src/lib/gozsduPmsRoster.test.ts src/components/dashboard/GozsduCourtRoomOverview.tsx
          git commit -m "fix(gozsdu): schedule stayover service by Previo completed nights and rename textile change"
          git push origin HEAD:fix/gozsdu-stay-night-service-cycle-20260917
