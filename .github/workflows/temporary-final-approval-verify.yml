name: Temporary final approval verification

on:
  push:
    branches:
      - feature/comprehensive-room-approvals

permissions:
  contents: write

jobs:
  merge-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/comprehensive-room-approvals
          fetch-depth: 0

      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies without rewriting the stale lock file
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run focused approval tests
        run: npm test -- src/lib/approval-instruction-context.test.ts

      - name: Build application
        run: npm run build

      - name: Push verified main merge
        run: git push origin HEAD:feature/comprehensive-room-approvals
