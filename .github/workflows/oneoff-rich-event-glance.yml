name: One-off rich revenue event glance

on:
  push:
    branches:
      - fix/revenue-rich-event-glance-20260930

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-rich-event-glance-20260930
          fetch-depth: 0

      - name: Restore rich event cards on mobile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app-entry.tsx')
          s = app.read_text()
          s = s.replace('import "./styles/rate-calendar-mobile-events-polish.css";\n', '')
          s = s.replace('import { installRateCalendarMobileEvents } from "@/lib/rateCalendarMobileEvents";\n', '')
          s = s.replace('installRateCalendarMobileEvents();\n', '')
          app.write_text(s)

          p = Path('src/components/revenue/RateStrategyGrid.tsx')
          s = p.read_text()

          old = 'import { Loader2, CalendarRange, ChevronDown, Info, AlertTriangle, Send, History, SlidersHorizontal, Maximize2, Minimize2, ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UserRound, UsersRound } from "lucide-react";'
          new = 'import { Loader2, CalendarRange, ChevronDown, Info, AlertTriangle, Send, History, SlidersHorizontal, Maximize2, Minimize2, ZoomIn, ZoomOut, Star, ChevronLeft, ChevronRight, X, UserRound, UsersRound, Eye } from "lucide-react";'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise AssertionError('lucide import changed')

          if 'function compactEventRange(' not in s:
              anchor = '\n\n/** Small info bubble that works on hover and on touch. */'
              assert anchor in s
              helper = (
                  '\n\n/** Compact visible start/end range for an event in a narrow date column. */\n'
                  'function compactEventRange(event: DemandEventDetail, fallbackDate: string): string {\n'
                  '  const parse = (value?: string | null) => {\n'
                  '    const match = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(value ?? "");\n'
                  '    if (!match) return null;\n'
                  '    return { iso: `${match[1]}-${match[2]}-${match[3]}`, month: Number(match[2]), day: Number(match[3]) };\n'
                  '  };\n'
                  '  const start = parse(event.start) ?? parse(fallbackDate);\n'
                  '  const end = parse(event.end) ?? start;\n'
                  '  if (!start || !end) return "";\n'
                  '  if (start.iso === end.iso) return String(start.day);\n'
                  '  if (start.month === end.month) return `${start.day}–${end.day}`;\n'
                  '  const initials = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];\n'
                  '  return `${start.day}${initials[start.month - 1] ?? ""}–${end.day}${initials[end.month - 1] ?? ""}`;\n'
                  '}\n'
              )
              s = s.replace(anchor, helper + anchor, 1)

          s = s.replace('The calendar shows the four strongest signals for each night;', 'The calendar shows the five strongest signals for each night;', 1)
          s = s.replace('Math.round(74 * zoom)', 'Math.round(86 * zoom)', 1)

          old = 'className={`shrink-0 overflow-hidden px-0.5 py-0.5 text-left hover:ring-1 hover:ring-inset hover:ring-primary/50 ${dayBg(d, i)} ${dayEdge(d)}`}'
          new = 'className={`relative shrink-0 overflow-hidden px-0.5 py-0.5 text-left hover:ring-1 hover:ring-inset hover:ring-primary/50 ${dayBg(d, i)} ${dayEdge(d)}`}'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise AssertionError('event button class changed')

          old = 'all.map((e, n) => `${n + 1}. ${e.title} — ${e.impact} impact`)'
          new = 'all.map((e, n) => `${n + 1}. ${e.start ?? d}${e.end && e.end !== e.start ? ` → ${e.end}` : ""} · ${e.title} — ${e.impact} impact`)'
          if old in s:
              s = s.replace(old, new, 1)

          old = '<div className="flex h-full flex-col gap-px overflow-hidden">\n                            {visible.map((e, n) => {'
          new = (
              '<div className="relative flex h-full flex-col gap-px overflow-hidden">\n'
              '                            {visible.length > 0 && (\n'
              '                              <Eye\n'
              '                                className="pointer-events-none absolute right-0.5 top-0.5 z-10 h-2.5 w-2.5 rounded-sm bg-card/85 p-[1px] text-foreground/70 shadow-sm"\n'
              '                                aria-hidden="true"\n'
              '                              />\n'
              '                            )}\n'
              '                            {visible.map((e, n) => {'
          )
          assert old in s, 'event stack opener changed'
          s = s.replace(old, new, 1)

          old = ': "border-border bg-muted/60 text-muted-foreground";\n                              return ('
          new = ': "border-border bg-muted/60 text-muted-foreground";\n                              const range = compactEventRange(e, d);\n                              return ('
          assert old in s, 'event impact block changed'
          s = s.replace(old, new, 1)

          old = 'className={`block truncate rounded-[2px] border px-0.5 font-medium leading-[11px] ${tone}`}'
          new = 'className={`flex min-w-0 items-center gap-0.5 rounded-[2px] border px-0.5 font-medium leading-[12px] ${n === 0 ? "pr-2.5" : ""} ${tone}`}'
          assert old in s, 'event chip class changed'
          s = s.replace(old, new, 1)

          old = '{impact === "high" ? "H" : impact === "medium" ? "M" : "L"} · {e.title}'
          new = '<span className="shrink-0 font-semibold tracking-[-0.03em]">{range}</span>\n                                  <span className="min-w-0 flex-1 truncate">{e.title}</span>'
          assert old in s, 'event chip content changed'
          s = s.replace(old, new, 1)

          s = s.replace(
              'className="block truncate text-center text-[8px] font-semibold text-muted-foreground"',
              'className="block truncate text-center text-[8px] font-semibold leading-[9px] text-muted-foreground"',
              1,
          )

          p.write_text(s)
          PY

          git diff --check

      - name: Commit rich event glance and remove one-off workflows
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-rich-event-glance.yml .github/workflows/oneoff-rich-event-glance-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app-entry.tsx src/components/revenue/RateStrategyGrid.tsx .github/workflows/oneoff-rich-event-glance.yml .github/workflows/oneoff-rich-event-glance-v2.yml
          git commit -m "ui: restore rich top-five event glance cards"
          git push origin HEAD:fix/revenue-rich-event-glance-20260930
