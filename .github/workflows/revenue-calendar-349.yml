name: Revenue calendar issue 349 implementation

on:
  push:
    branches:
      - feat/revenue-calendar-30-day-month-navigation
    paths:
      - scripts/apply_revenue_calendar_349.py
      - .github/workflows/revenue-calendar-349.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply source changes with strict anchors
        run: python3 scripts/apply_revenue_calendar_349.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify calendar date window tests
        run: bun run test -- src/lib/rateCalendarWindow.test.ts
      - name: Verify complete test suite
        run: bun run test
      - name: Verify production build
        run: bun run build
      - name: Commit tested implementation to feature branch only
        run: |
          git rm -- .github/workflows/revenue-calendar-349.yml scripts/apply_revenue_calendar_349.py
          git add src/components/revenue/RateStrategyGrid.tsx src/pages/RevenueHotelDetail.tsx src/hooks/useRevenueHotelData.ts src/components/revenue/MonthPerformanceHeader.tsx
          git -c user.name='hotelcare-calendar-ci' -c user.email='hotelcare-calendar-ci@users.noreply.github.com' commit -m 'feat(revenue): default to thirty dates and explicitly selected calendar months'
          git push origin HEAD:feat/revenue-calendar-30-day-month-navigation
